bank_info:
    title: Collision and Explosion in 2D
    bank_id: PHY1-CLM-CE2DMC-11102026 #Subject-Unit-Abbreviation_of_title_or_any_string-date
    description: |-
      Multiple-choice conversion of the numerical bank PHY1-CLM-CE2D-10232025. Each problem asks for a speed after a split, a launch, or a sticking collision in two dimensions.
    date created: 11-10-2026 # Today's date 
    status: draft # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field.
    learning objectives:
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            This multiple-choice bank was converted from the numerical bank PHY1-CLM-CE2D-10232025. Each problem keeps its scenario and the speed it asks for. The numerical answer is replaced by one correct choice and five distractors.

            The choice pattern is the q1 set in q1-mc-draft.md. choice-set-adaptation.md assigns the twenty-four problems to three calculations: calc_split.py for the twelve split and launch problems, calc_collision_forward.py for the sticking collisions that ask for the combined speed, and calc_collision_inverse.py for the sticking collisions that ask for one incoming speed. problem_inputs_temp.csv stores the known values, and run_all_calculations.py writes calculated_choices_temp.csv. build_mc_bank.py reads that table and PHY1-CLM-CE2D-10232025.yaml. Two statements were adjusted so the choices stay distinct: q2 gives the main body a vertical velocity component, and q5 takes the initial velocity as vertically upward.
    updates: 
        - update 1: (11/10/2026) Converted PHY1-CLM-CE2D-10232025 into this multiple-choice draft.
    associated data:
        - source bank: "../PHY1-CLM-CE2D-10232025/PHY1-CLM-CE2D-10232025.yaml"
        - choice pattern: "./q1-mc-draft.md"
        - adaptation plan: "./choice-set-adaptation.md"
        - split calculation: "./calc_split.py"
        - forward collision calculation: "./calc_collision_forward.py"
        - inverse collision calculation: "./calc_collision_inverse.py"
        - inputs: "./problem_inputs_temp.csv"
        - calculated choices: "./calculated_choices_temp.csv"
        - build script: "./build_mc_bank.py"
    generation details: # Details of the creation process
            model: Cursor Grok # The model used to generate the questions
            version: 4.7 # The version of the model used
            last updated: 11-10-2026 # The date of the last update of the generation prompts.
    authors:
        - Zhongzhou Chen

questions:
- multiple_choice:
    id: q1
    title: Conservation of Momentum Exploding Shell
    points: 3
    text: |
        A <latex>10.0 \text{ kg}</latex> cannon shell is traveling with an initial velocity of <latex>\vec{V} = (300 \hat{i}) \text{ m/s}</latex> when it suddenly explodes into two fragments.
        
        Immediately after the explosion, one fragment has a mass of <latex>4.0 \text{ kg}</latex>, is observed to be moving with a velocity of <latex>\vec{v}_1 = (320 \hat{i} + 50 \hat{j}) \text{ m/s}</latex>.
        
        Assuming the linear momentum of the shell system is conserved immediately before and after the explosion, what is the magnitude of the velocity of the second fragment? Round your answer to two decimal places after zero.
    answers:
        - answer:
            text: 288.60 m/s
            correct: true
        - answer:
            text: 286.67 m/s
            correct: false
        - answer:
            text: 282.96 m/s
            correct: false
        - answer:
            text: 53.85 m/s
            correct: false
        - answer:
            text: 284.08 m/s
            correct: false
        - answer:
            text: -23.88 m/s
            correct: false
    feedback:
        general: |
          Conserve linear momentum separately on each axis, then combine the components. The magnitude is <b><latex>288.60\text{ m/s}</latex></b>.
        on_correct: Good job!
        on_incorrect: Try again!

