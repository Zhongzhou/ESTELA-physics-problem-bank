        Immediately after the separation, the main body, which has a mass of <latex>150.00 \text{ kg}</latex>, is observed to be moving with a velocity of <latex>\vec{v}_2 = (4996.67 \hat{i} - 50.00 \hat{j}) \text{ m/s}</latex>. The separated payload section has the remaining mass of <latex>50.00 \text{ kg}</latex>.
        
        Assuming the linear momentum of the rocket system is conserved immediately before and after the separation, what is the magnitude of the velocity of the payload section? Round your answer to two decimal places.
