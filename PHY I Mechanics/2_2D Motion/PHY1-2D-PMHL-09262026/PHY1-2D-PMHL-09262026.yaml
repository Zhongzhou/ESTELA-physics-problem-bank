bank_info:
  title: Horizontal-launch projectile motion
  bank_id: PHY1-2D-PMHL-09262026
  description: Ten numerical problems involving horizontal launch followed by free fall on Earth or the Moon. Targets
    include launch speed, horizontal range, flight time, final speed, and final velocity direction. Question text
    and complete eight-step solutions use HTML with MathJax delimiters.
  date created: 09-26-2026
  status: ready
  learning objectives:
    - Resolve horizontal-launch projectile motion into horizontal and vertical components.
    - Apply constant-acceleration kinematics to determine launch speed, range, fall time, final speed, or final
      velocity direction.
  generation prompts:
    - prompt 1: Generate ten horizontal-launch scenarios with context-appropriate heights and speeds. Revise Scenario
        4 to a stone thrown horizontally from a 45.0 m cliff, and Scenario 10 to a motorcycle leaving a 6.50 m ledge.
    - prompt 2: 'Write one word problem per scenario using these given quantities and targets: 1: h and R -> v0x;
        2: h and v0x -> R; 3: h and v0x -> R; 4: h and v0x -> final speed; 5: h and R -> v0x; 6: h and v0x -> time;
        7: h and v0x -> R; 8: h and v0x -> final direction; 9: time and v0x -> direction below horizontal; 10: h
        and R -> v0x. Explicitly state horizontal launch, provide lunar gravity, and use plain-language questions.'
    - prompt 3: Use the solve-2d-kinematics skill to provide an eight-step solution for each scenario. Calculate
        answers from the printed givens, preserving their stated precision.
    - formatting prompt: Use Problem-bank-template-num.yaml for the numerical bank structure. Store question heads
        and full solutions as accessible HTML fragments with \( ... \) and \[ ... \] MathJax delimiters; save the
        questions and solutions in separate Markdown files.
  updates:
    - update 1: '09-26-2026: ChatGPT drafted the ten questions, derived the solutions from their stated givens,
        and assembled the bank using the numerical YAML template.'
  associated data:
    - scenario data table: ./horizontal_projectile_scenarios.csv
    - questions: ./horizontal_projectile_questions.md
    - worked solutions: ./horizontal_projectile_solutions.md
    - numerical bank template: ./Problem-bank-template-num.yaml
  generation details:
    model: ChatGPT
    version: 6 Astra
    last updated: 09-26-2026
  authors:
    - O. Moussa
questions:
  - numerical:
      id: q1
      title: 'PHY1-2DM-HL — Scenario 1: Marble launched from a laboratory bench'
      points: 1
      text: |-
        <section>
        <p>A spring launcher fires a marble horizontally from a laboratory bench \(1.20\ \mathrm{m}\) above the floor. The marble lands \(1.24\ \mathrm{m}\) horizontally from the point on the floor directly below its launch point. Neglect air resistance. <strong>How fast was the marble moving when it left the launcher?</strong></p>
        <p>Report your answer in \(\mathrm{m/s}\), to three significant figures.</p>
        </section>
      answer:
        value: 2.51
        margin_type: percent
        tolerance: 5
      feedback:
        general: |-
          <section>
          <h2>Scenario 1: Marble launched from a laboratory bench — solution</h2>
          <h3>1. Identify the physics</h3>
          <p>After launch, the marble moves in a vertical plane with a constant downward acceleration vector. The vector kinematic equations therefore apply and can be resolved along fixed horizontal and vertical axes. Neglect air resistance as stated, and assume \(g=9.80\ \mathrm{m/s^2}\) near Earth's surface.</p>
          <h3>2. State the given information and requested quantity</h3>
          <p>Given: \(h=1.20\ \mathrm{m}\); \(R=1.24\ \mathrm{m}\). Horizontal launch also gives \(v_{iy}=0\ \mathrm{m/s}\).</p>
          <p>Find the horizontal launch speed \(v_{0x}\). The requested speed is the magnitude of the initial instantaneous velocity, \(v_i=|\vec v_i|\); because launch is horizontal along +x, \(v_i=v_{0x}&gt;0\).</p>
          <h3>3. Identify the segment of motion</h3>
          <p>Study the interval from event L, when the marble leaves the launcher, to event F, when the marble is just about to strike the floor. Choose \(t_L=0\) and define \(\Delta t=t_F-t_L&gt;0\). The impact itself and any subsequent motion are outside this interval.</p>
          <h3>4. Establish coordinates and vector notation</h3>
          <p>Choose the origin at the launch point. Let +x point horizontally in the launch direction, with unit vector \(\hat{\imath}\), and let +y point upward, with unit vector \(\hat{\jmath}\). Thus \(\Delta x=R\); when the height is given, \(\Delta y=-h\). Write \(v_{ix}=v_{0x}\). Measure vector directions counterclockwise from +x in \([0^\circ,360^\circ)\).</p>
          <div class="equation">\[
          \Delta\vec r=\Delta x\hat{\imath}+\Delta y\hat{\jmath},\qquad \vec v_i=v_{0x}\hat{\imath}+(0\ \mathrm{m/s})\hat{\jmath},
          \]</div>
          <div class="equation">\[
          \vec v_f=v_{fx}\hat{\imath}+v_{fy}\hat{\jmath},\qquad \vec a=(0\ \mathrm{m/s^2})\hat{\imath}-g\hat{\jmath}.
          \]</div>
          <h3>5. Make the kinematic-variable table</h3>
          <div style="overflow-x: auto;" tabindex="0" role="region" aria-label="Kinematic vectors for Scenario 1">
          <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic vectors for Scenario 1</caption>
          <thead><tr>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Kinematic variable</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Vector representation</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Magnitude</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Direction</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">x-component</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">y-component</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Status/explanation</th>
          </tr></thead>
          <tbody>
          <tr>
          <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(\Delta\vec r=(1.24\ \mathrm{m})\hat{\imath}-(1.20\ \mathrm{m})\hat{\jmath}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(1.24\ \mathrm{m}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(-1.20\ \mathrm{m}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Horizontal range and height are explicitly given; the negative y-component follows from the axes. Magnitude and direction are other unknowns, not required.</td>
          </tr>
          <tr>
          <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(\vec v_i=v_{0x}\hat{\imath}+(0\ \mathrm{m/s})\hat{\jmath}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(0^\circ\) along +x</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(0\ \mathrm{m/s}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Horizontal launch speed and initial speed are target unknowns. Horizontal launch implicitly gives a zero y-component and direction along +x.</td>
          </tr>
          <tr>
          <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(\vec v_f=v_{fx}\hat{\imath}+v_{fy}\hat{\jmath}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final components, magnitude, and direction are other unknowns, not required.</td>
          </tr>
          <tr>
          <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(\vec a=(0\ \mathrm{m/s^2})\hat{\imath}-(9.80\ \mathrm{m/s^2})\hat{\jmath}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(9.80\ \mathrm{m/s^2}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(270^\circ\) counterclockwise from +x (downward)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(0\ \mathrm{m/s^2}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(-9.80\ \mathrm{m/s^2}\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Assumption: near-Earth gravity has magnitude 9.80 m/s². The ideal projectile model gives a zero x-component; the negative y-component follows from +y upward.</td>
          </tr>
          </tbody></table>
          </div>
          <div style="overflow-x: auto;" tabindex="0" role="region" aria-label="Time interval for Scenario 1">
          <table style="border-collapse: collapse; width: 100%;">
          <caption>Time interval for Scenario 1</caption>
          <thead><tr>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Kinematic variable</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Symbol</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Value</th>
          <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Status/explanation</th>
          </tr></thead>
          <tbody>
          <tr>
          <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">\(\Delta t\)</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">?</td>
          <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Other unknown; an intermediate quantity if needed. The same elapsed time applies to both axes.</td>
          </tr>
          </tbody></table>
          </div>
          <p>Horizontal launch means \(v_{iy}=0\), not \(v_{0x}=0\). The origin and positive directions are coordinate choices; the gravity model is an assumption where not supplied.</p>
          <h3>6. Select the equations</h3>
          <p>Use the displacement-time vector equation. Its y-component gives the fall time from the height; its x-component then connects that same time and the given range to \(v_{0x}\). Final velocity is not needed.</p>
          <h3>7. Rearrange symbolically</h3>
          <div class="equation">\[
          \Delta\vec r=\vec v_i\Delta t+\tfrac12\vec a(\Delta t)^2.
          \]</div>
          <div class="equation">\[
          R=v_{0x}\Delta t+\tfrac12a_x(\Delta t)^2=v_{0x}\Delta t,
          \]</div>
          <div class="equation">\[
          -h=v_{iy}\Delta t+\tfrac12a_y(\Delta t)^2=0\Delta t-\tfrac12g(\Delta t)^2.
          \]</div>
          <div class="equation">\[
          (\Delta t)^2=\frac{2h}{g}\quad\Longrightarrow\quad \Delta t=\pm\sqrt{\frac{2h}{g}}.
          \]</div>
          <p>The final event occurs after launch, so \(\Delta t&gt;0\). Select the positive root:</p>
          <div class="equation">\[
          \Delta t=\sqrt{\frac{2h}{g}}.
          \]</div>
          <div class="equation">\[
          v_{0x}=\frac{R}{\Delta t}=R\sqrt{\frac{g}{2h}},
          \]</div>
          <div class="equation">\[
          v_i=|\vec v_i|=\sqrt{v_{0x}^{\,2}+v_{iy}^{\,2}}=\sqrt{v_{0x}^{\,2}+0^2}=v_{0x}\quad(v_{0x}&gt;0).
          \]</div>
          <h3>8. Substitute, solve, and verify</h3>
          <div class="equation">\[
          \Delta t=\sqrt{\frac{2(1.20\ \mathrm{m})}{9.80\ \mathrm{m/s^2}}}=0.494871659\ldots\ \mathrm{s}.
          \]</div>
          <div class="equation">\[
          v_{0x}=\frac{1.24\ \mathrm{m}}{0.494871659\ldots\ \mathrm{s}}=2.505700168\ldots\ \mathrm{m/s}.
          \]</div>
          <div class="equation">\[
          \vec v_i\approx(2.51\ \mathrm{m/s})\hat{\imath}+(0\ \mathrm{m/s})\hat{\jmath},\qquad \boxed{v_i=v_{0x}=2.51\ \mathrm{m/s}}.
          \]</div>
          <p>This is the speed as the marble leaves the launch point, directed horizontally along +x. The answer is rounded to three significant figures.</p>
          <p>Check: dividing a length by a time gives m/s. With unrounded values, \(v_{0x}\Delta t=R\) and \(-\tfrac12g(\Delta t)^2=-h\), so both coordinates describe the same landing event. The positive time implies \(v_{fy}=-g\Delta t&lt;0\), consistent with downward arrival.</p>
          </section>
        on_correct: Correct. Review the solution to check your vector setup, units, and reasoning.
        on_incorrect: Review the horizontal and vertical components in the worked solution, using the same elapsed
          time for both axes.
