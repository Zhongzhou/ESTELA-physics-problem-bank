          \]</div>
          <div class="equation">\[
          R=v_{0x}\Delta t+\tfrac12a_x(\Delta t)^2=v_{0x}\Delta t,
          \]</div>
          <div class="equation">\[
          -h=v_{iy}\Delta t+\tfrac12a_y(\Delta t)^2=0\Delta t-\tfrac12g(\Delta t)^2.
          \]</div>
          <div class="equation">\[
          (\Delta t)^2=\frac{2h}{g}\quad\Longrightarrow\quad \Delta t=\pm\sqrt{\frac{2h}{g}}.
          \]</div>
