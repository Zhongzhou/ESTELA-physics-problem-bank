          <div class="equation">\[
          \Delta t=\sqrt{\frac{2h}{g}}.
          \]</div>
          <div class="equation">\[
          R=v_{0x}\Delta t=v_{0x}\sqrt{\frac{2h}{g}}.
          \]</div>
          <h3>8. Substitute, solve, and verify</h3>
          <div class="equation">\[
          \Delta t=\sqrt{\frac{2(0.800\ \mathrm{m})}{9.80\ \mathrm{m/s^2}}}=0.404061017\ldots\ \mathrm{s}.
          \]</div>
          <div class="equation">\[
          R=(1.80\ \mathrm{m/s})(0.404061017\ldots\ \mathrm{s})=0.727309832\ldots\ \mathrm{m},
          \]</div>
          <div class="equation">\[
          \boxed{R=0.727\ \mathrm{m}}.
          \]</div>
