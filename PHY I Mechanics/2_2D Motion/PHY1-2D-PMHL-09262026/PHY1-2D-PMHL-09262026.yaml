        <section>
        <p>Water shoots horizontally from a tank nozzle \(1.50\ \mathrm{m}\) above the ground. A droplet lands \(1.66\ \mathrm{m}\) horizontally from the point on the ground directly below the nozzle. Neglect air resistance. <strong>How fast was the droplet moving as it left the nozzle?</strong></p>
