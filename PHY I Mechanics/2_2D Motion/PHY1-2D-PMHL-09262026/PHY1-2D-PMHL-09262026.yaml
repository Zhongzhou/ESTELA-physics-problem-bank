          <h3>2. State the given information and requested quantity</h3>
          <p>Given: \(v_{0x}=2.00\ \mathrm{m/s}\); \(\Delta t=1.22\ \mathrm{s}\); \(g=1.62\ \mathrm{m/s^2}\) downward. Horizontal launch also gives \(v_{iy}=0\ \mathrm{m/s}\).</p>
          <p>Find the angle \(\alpha\) of the final instantaneous velocity below the horizontal at landing. This is not the direction of the displacement from the rover.</p>
          <h3>3. Identify the segment of motion</h3>
          <p>Study the interval from event L, when the rock sample leaves the rover's ejector, to event F, when the rock sample is just about to strike the lunar surface. Choose \(t_L=0\) and define \(\Delta t=t_F-t_L&gt;0\). The impact itself and any subsequent motion are outside this interval.</p>
