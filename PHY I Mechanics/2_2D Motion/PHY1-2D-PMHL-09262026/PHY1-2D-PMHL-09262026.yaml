          \theta_{\mathrm{signed}}=\operatorname{atan2}(v_{fy},v_{fx}),\qquad \theta_f=\theta_{\mathrm{signed}}+360^\circ.
          \]</div>
          <div class="equation">\[
          \alpha=-\theta_{\mathrm{signed}}=\operatorname{atan2}(-v_{fy},v_{fx})=\operatorname{atan2}(g\Delta t,v_{0x}).
          \]</div>
          <p>The atan2 results are evaluated in degrees. Here \(\alpha\) is positive below the horizontal, as requested.</p>
          <div class="equation">\[
          \alpha=\operatorname{atan2}\!\left(g\sqrt{\frac{2h}{g}},v_{0x}\right)=\operatorname{atan2}\!\left(\sqrt{2gh},v_{0x}\right).
          \]</div>
          <h3>8. Substitute, solve, and verify</h3>
          <div class="equation">\[
          \Delta t=\sqrt{\frac{2(1.50\ \mathrm{m})}{9.80\ \mathrm{m/s^2}}}=0.553283335\ldots\ \mathrm{s}.
          \]</div>
          <div class="equation">\[
          v_{fx}=1.20\ \mathrm{m/s},\qquad v_{fy}=(0\ \mathrm{m/s})+(-9.80\ \mathrm{m/s^2})(0.553283335\ldots\ \mathrm{s})=-5.422176684\ldots\ \mathrm{m/s}.
          \]</div>
          <div class="equation">\[
          \vec v_f\approx(1.20\ \mathrm{m/s})\hat{\imath}-(5.42\ \mathrm{m/s})\hat{\jmath}.
          \]</div>
          <div class="equation">\[
          \alpha=\operatorname{atan2}(5.422176684\ldots\ \mathrm{m/s},1.20\ \mathrm{m/s})=77.520826677\ldots^\circ,
          \]</div>
          <div class="equation">\[
          \boxed{\alpha=77.5^\circ\ \text{below the horizontal}}.
          \]</div>
          <p>The equivalent direction is approximately \(282.5^\circ\) counterclockwise from +x. The requested angle below the horizontal is reported to three significant figures.</p>
          <p>Check: the two arguments of atan2 have the same units, so their ratio is dimensionless. The positive x-component and negative y-component confirm motion forward and downward; \(0^\circ&lt;\alpha&lt;90^\circ\). This is the direction of instantaneous velocity, not displacement.</p>
          <p>The same positive elapsed time gives both \(\Delta y=-h\) and the final velocity; the selected root therefore describes the stated landing event.</p>
          </section>
