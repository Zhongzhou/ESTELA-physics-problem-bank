          <p>At event F the stone is falling: \(v_{fy}=-g\Delta t&lt;0\) for \(\Delta t&gt;0\). Select the negative root, \(v_{fy}=-\sqrt{2gh}\).</p>
          <div class="equation">\[
          v_f=|\vec v_f|=\sqrt{v_{fx}^{\,2}+v_{fy}^{\,2}}=\sqrt{v_{0x}^{\,2}+2gh}.
          \]</div>
          <h3>8. Substitute, solve, and verify</h3>
          <div class="equation">\[
          v_{fx}=12.0\ \mathrm{m/s},\qquad v_{fy}=-\sqrt{2(9.80\ \mathrm{m/s^2})(45.0\ \mathrm{m})}=-29.698484809\ldots\ \mathrm{m/s}.
          \]</div>
          <div class="equation">\[
          \vec v_f\approx(12.0\ \mathrm{m/s})\hat{\imath}-(29.7\ \mathrm{m/s})\hat{\jmath}.
          \]</div>
          <div class="equation">\[
          v_f=\sqrt{(12.0\ \mathrm{m/s})^2+(-29.698484809\ldots\ \mathrm{m/s})^2}=32.031234756\ldots\ \mathrm{m/s},
          \]</div>
          <div class="equation">\[
          \boxed{v_f=32.0\ \mathrm{m/s}}.
          \]</div>
          <p>This is the speed immediately before the stone hits the ground, rounded to three significant figures.</p>
          <p>Check: each term under the square root has units of \(\mathrm{m^2/s^2}\). The negative y-component selects downward arrival; its associated elapsed time \(-v_{fy}/g\) is positive and gives the same fall height. The horizontal component remains positive and constant. The final speed exceeds the launch speed because a downward component has developed.</p>
