        <section>
        <p>A rover on the Moon ejects a rock sample horizontally at \(2.00\ \mathrm{m/s}\). The sample lands on the lunar surface \(1.22\ \mathrm{s}\) after release. The Moon's gravitational acceleration is \(1.62\ \mathrm{m/s^2}\) downward. Assume that only gravity acts on the sample after release. <strong>At what angle below the horizontal is the sample moving just before it lands?</strong></p>
