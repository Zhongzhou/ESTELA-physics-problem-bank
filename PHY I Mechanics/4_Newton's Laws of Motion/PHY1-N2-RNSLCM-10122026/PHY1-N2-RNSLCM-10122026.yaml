      <p>A motorcycle and rider move at constant speed around a flat, unbanked circular path. The engine provides only tangential forces to overcome resistance. A constant wind blows the motorcycle and rider from right to left during the entire circle. The figure is a top view of the path that shows three positions of the motorcycle and rider during the circle. The motorcycle and rider are at the leftmost point of the path at position 1, at the point at the top of the figure at position 2, and at the rightmost point of the path at position 3.</p>
      <p>Take the positive direction along the radius to be toward the center of the circle. Which of the following equations correctly expresses Newton's second law for the motorcycle and rider <strong>along the radial direction</strong> at <strong>position 2</strong> (point at the top of the figure)?</p>
      <p>\(f_s\) is the radial component of the static friction force between the tires of the motorcycle and the path. It is positive toward the center and negative away from the center.</p>
      <p>\(F_w\) is the magnitude of the force exerted by the wind on the motorcycle and rider.</p>
      <p>\(m\) is the mass of the motorcycle and rider combined.</p>
      <p>\(a_c\) is the magnitude of the centripetal acceleration of the motorcycle and rider.</p>
      <p>\(F_c\) is the magnitude of the centripetal force on the motorcycle and rider.</p>
    figure: diagrams/12-motorcycle.png
    answers:
    - answer:
        text: <p>\(f_s + F_w = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(f_s - F_w = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(f_s = m a_c\)</p>
        correct: true
    - answer:
        text: <p>\(f_s + F_w + F_c = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(f_s - F_w + F_c = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(f_s + F_c = m a_c\)</p>
        correct: false
    feedback:
        general: |
          <p>The engine's force is tangential, so it has no radial component. At the point at the top of the figure, the wind blows perpendicular to the radius and has no radial component. The radial component of friction alone equals \(m a_c\). The centripetal force is already that net inward force, so it is not added again.</p>

