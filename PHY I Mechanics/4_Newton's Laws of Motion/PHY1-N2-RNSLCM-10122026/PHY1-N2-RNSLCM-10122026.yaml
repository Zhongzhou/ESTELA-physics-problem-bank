bank_info:
    title: Radial Newton's Second Law in Circular Motion
    bank_id: PHY1-N2-RNSLCM-10122026 # Subject-Unit-Abbreviation-date
    description: |-
      Thirty-six multiple-choice problems on Newton's second law along the radial direction for an object in circular motion. Twelve scenarios are each asked at three labeled positions. The positive radial direction is toward the center of the circle.

      The scenarios cover a vertical circle on a string, a vertical circle on a frictionless track, a horizontal circle on a string with wind or current, and a horizontal circle on a flat road with friction and wind.
    date created: 10-12-2026
    status: deployed # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field. 'draft' and 'deprecated' files won't be parsed by the exam builder.
    learning objectives: # Not yet assigned.
    generation prompts: # In order: problem-creation session, problem-review session, then this YAML session.
        - prompt 1: |
            Review the @PHY I Mechanics/4_Newton's Laws of Motion/Circular motion draft/Creation Plan.md document and let me know if you need any additional clarification/decision to proceed.
        - prompt 2: |
            1. Flat road: friction replaces normal force. slotted track: use normal force, keep the track frictionless 2. direction be added later as a variation. 3. I am only asking for the force/force component on the radial direction, so drag or buoyancy won't matter. 4. Let's shoot for the 36 grid. We can always eliminate unnatural scenarios later. The goal is to have at least 30 variations. Now proceed with step 1.
        - prompt 3: |
            for the last scenario, replace the go-kart with something else since not all students are familiar with go-kart.
        - prompt 4: |
            Now proceed to the next step according to plan. Do not generate image for backup scenarios. Store the images in a markdown file. For horizontal cases, clearly label the image as "top view".
        - prompt 5: |
            Now proceed to the next step according to plan. Do not generate image for backup scenarios. Store the images in a markdown file. For horizontal cases, clearly label the image as "top view".
        - prompt 6: |
            1. the "top view" and "side view" should be much less prominent, the same font size as everything else and without bonding boxes. 2. The locations should be labeled as 1, 2 and 3, rather than using text. 3. The array of arrows in the horizontal cases should be aligned vertically instead of horizontally, and placed on the side of the origin of the force. (put on left for a left to right wind/current).
        - prompt 7: |
            Remove extra white spaces around the images so that the size of the figures are just big enough to include all contents.
        - prompt 8: |
            Now write the problem bodies and choice items according to the specifications in @PHY I Mechanics/4_Newton's Laws of Motion/Circular motion draft/Creation Plan.md item 3.
        - prompt 9: |
            I've made comments on problem 1 and problem 4 in the document. You should mirro the problem 1 comments on all other problems. Rewrite the 4 problms for my review.
        - prompt 10: |
            Using those four problems as example, write all the other variations.
        - prompt 11: |
            Evaluate the correctness and clarity of all problems in @PHY I Mechanics/4_Newton's Laws of Motion/Circular motion draft/problems.md make small fixes automatically, and list major updates for me to consider.
        - prompt 12: |
            1. Add that the motor or engine only provides tangential forces to overcome resistance. 2. Yes please. 3. in all horizontal cases that is not on the ground, say that weight is balanced by either buoyancy or airlift. On the ground cases can be ommitted. 4.  Yes. 5. I think "northmost point" will introduce other sources of confusion. So we can just leave the wording as is. Implement those changes. Then for each problem, write a brief feedback message explaining why the correct answer should be chosen.
        - prompt 13: |
            The class marbal and toy car images needs to be fixed since the small orange circle is not touching the inside of the track circle. The position of the center of the small orange circle should be at big circle radius minus small circle radius.
        - prompt 14: |
            From @PHY I Mechanics/4_Newton's Laws of Motion/Circular motion draft/problems.md use @Templates/Problem-bank-template-mathjax.yaml and create a yaml file in the circular motion folder for this problem bank. First fill in the question field with the problem contents, then fille in as many meta-data filed as you can and ask me what other information you need.
        - prompt 15: |
            1. abbreviation should be RNSLCM, consistent with the title. 2. learning objectives can be blank for now. 3. 1 point for each question. In addition, list all my prompts in the other two related sessions as well as in this session under "generation prompts" in the form of - prompt 1: - prompt 2: etc. I fixed everything else.
    updates:
        - update 1: (10/12/2026) Converted Circular motion draft/problems.md into this MathJax YAML. Question text, figures, answer choices, correct responses, and general feedback were taken from that draft.
    associated data:
