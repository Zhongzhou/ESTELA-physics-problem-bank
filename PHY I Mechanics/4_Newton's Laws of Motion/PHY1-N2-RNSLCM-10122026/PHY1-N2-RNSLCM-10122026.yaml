questions:

- multiple_choice:
    id: q1
    title: Bucket of water, position 1
    points: 1
    text: |
      <p>A gardener swings a small bucket of water, tied to a rope, through a full vertical circle. The rope stays taut and the water stays in the bucket during the entire circle, as shown in the figure. The figure is a side view of the path that shows three positions of the bucket during the circle. The bucket is at the top of the path at position 1, at the right-hand side of the path at position 2, and at the bottom of the path at position 3.</p>
      <p>Take the positive direction along the radius to be toward the center of the circle. Which of the following equations correctly expresses Newton's second law for the bucket of water <strong>along the radial direction</strong> at <strong>position 1</strong> (top of the path)?</p>
      <p>\(T\) is the magnitude of the tension in the rope.</p>
      <p>\(m\) is the mass of the bucket of water.</p>
      <p>\(g\) is the acceleration due to gravity.</p>
      <p>\(a_c\) is the magnitude of the centripetal acceleration of the bucket of water.</p>
      <p>\(F_c\) is the magnitude of the centripetal force on the bucket.</p>
    figure: diagrams/01-bucket-of-water.png
    answers:
    - answer:
        text: <p>\(T + mg = m a_c\)</p>
        correct: true
    - answer:
        text: <p>\(T - mg = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(T = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(T + mg + F_c = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(T - mg + F_c = m a_c\)</p>
        correct: false
    - answer:
        text: <p>\(T + F_c = m a_c\)</p>
        correct: false
    feedback:
        general: |
          <p>At the top, the rope pulls toward the center and the weight also points toward the center. Both contributions are positive, so \(T + mg = m a_c\). The centripetal force is already that net inward force, so it is not added again.</p>

