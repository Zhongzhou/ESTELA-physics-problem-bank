 <title>Inclined-plane pulley geometry</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Inclined-plane pulley geometry</dc:title>
    <dc:date>2026-10-17T12:15:13.378650</dc:date>
    <dc:description>Object A, a wooden stage prop, is on the left on a rough incline sloping downward to the right. A rope runs parallel to the incline to a fixed pulley at the lower right end, then vertically down to object B, a freely hanging counterweight, on the right. The angle theta is marked between the surface and a horizontal reference. The axes originate on A: positive x points right along the incline and positive y points perpendicular to and outward from the surface.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.10.8, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
