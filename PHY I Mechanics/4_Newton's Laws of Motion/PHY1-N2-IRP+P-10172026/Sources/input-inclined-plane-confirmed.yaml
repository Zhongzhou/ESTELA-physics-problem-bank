# Confirmed setup and visual revisions: 2026-10-17.
Question:
  - situation: |
      An object A of mass \(m_A\) slides on a straight, rough inclined surface
      making an acute angle \(\theta\) with the horizontal. A is on the left.
      A taut, massless, inextensible rope connects A to a freely hanging object
      B of mass \(m_B\) on the right, passing over a fixed, ideal pulley at the
      right end of the incline. The rope attached to A is parallel to the
      incline. The coefficient of kinetic friction is \(\mu_k>0\).
      A remains in contact with the surface. Gravity, the normal force,
      tension, and kinetic friction are the only external forces on A.
  - given: |
      The coordinate origin is on A. Positive x is parallel to the incline
      and nominally right: uphill on the right-rising slope and downhill on
      the right-falling slope. Positive y is perpendicular to and outward
      from the surface. The text states whether A moves uphill or downhill
      and whether it speeds up or slows down at the instant shown.
      The figure shows the geometry and coordinate axes. Infer acceleration's
      direction from the stated motion and whether A speeds up or slows down.
      Define \(T\) as the tension magnitude, \(N\) as the
      normal-force magnitude, \(g\) as the gravitational-acceleration magnitude,
      and \(a_A>0\) as A's acceleration magnitude. The unit vectors
      \(\hat{\imath}\) and \(\hat{\jmath}\) point along the displayed positive axes.
  - ask: |
      Choose the correct vector form of Newton's second law for object A
      in the coordinate system shown.

scenario and variations:
  - common variations: []
  - scenario 1:
    - description: |
        The surface rises to the right. The fixed pulley is at the upper right
        end, so tension acts uphill (+x). Gravity's parallel component is downhill (-x).
    - variation 1: |
        kinematic_state: uphill_speeding_up, uphill_slowing_down,
        downhill_speeding_up, downhill_slowing_down. State the motion direction
        and speeding up or slowing down in words. Acceleration is along velocity
        when speeding up and opposite it when slowing down.
    - specifications: |
        Every candidate scene must support all listed kinematic states with
        physically appropriate masses, angle, and friction. Parameters may
        differ between variants. These symbolic questions require no numerical
        values. Motion, acceleration, and kinetic friction are nonzero.
        Exclude rolling, static equilibrium, slack rope, extra applied forces,
        and loss of contact. Do not bake one variation value into a reusable scene.
  - scenario 2:
    - description: |
        The surface falls to the right. The fixed pulley is at the lower right
        end, so tension and gravity's parallel component both act downhill (+x).
        The rope leaves the pulley vertically downward to the freely hanging B,
        which clears the incline and support.
    - variation 1: |
        kinematic_state: downhill_speeding_up, downhill_slowing_down.
        A moves downhill in every item in this scenario. State speeding up
        or slowing down in words. Acceleration is along velocity when
        speeding up and opposite it when slowing down.
    - specifications: |
        Exclude all uphill motion in this scenario, as requested by the user.
        Downhill_slowing_down requires uphill friction to exceed the sum of
        downhill tension and parallel gravity. Every scene must support both
        listed states with suitable parameters, which may differ between
        variants. These symbolic questions require no numerical values.
        Motion, acceleration, and kinetic friction are nonzero.
        Exclude rolling, static equilibrium, slack rope, extra applied forces,
        and loss of contact. Do not bake one variation value into a reusable scene.

Diagram:
  - need diagram: Yes
  - diagram specification: |
      Use Python to draw A on the left on the appropriate incline, the fixed
      pulley at the right end, and B freely hanging on the right. The rope
      attached to A is parallel to the incline, and the segment to B is vertical.
      Label A and B; mark acute theta relative to a horizontal reference.
      Draw axes originating at A: +x along the incline pointing right, and
      +y perpendicular to and outward from the surface.
      Show geometry and coordinate axes only. Do not draw acceleration,
      velocity, or force arrows. Students infer acceleration's direction
      from the motion description and identify the forces themselves.
      Use legible labels without overlaps and provide descriptive alt text.
      Draw one figure per selected scene and reuse it across that scene's
      kinematic states. A kinematic-state variation does not change the drawing.

Choice Items:
  # Baseline equations: scenario 1, moving uphill and speeding up.
  # Apply the choice-variation substitutions to every generated item.
  - possible answer 1: |
      \[
      \left(T-m_A g\sin\theta-\mu_k N\right)\hat{\imath}
      +\left(N-m_A g\cos\theta\right)\hat{\jmath}
      =m_A a_A\hat{\imath}
      \]
  - possible answer 2: |
      \[
      \left(T-m_A g\sin\theta-\mu_k N\right)\hat{\imath}
      +\left(N-m_A g\cos\theta\right)\hat{\jmath}
      =-m_A a_A\hat{\imath}
      \]
  - distractor 1: |
      \[
      \left(T-\mu_k N\right)\hat{\imath}
      +\left(N-m_A g\cos\theta\right)\hat{\jmath}
      =m_A a_A\hat{\imath}
      \]
  - distractor 2: |
      \[
      \left(T-m_A g\sin\theta-\mu_k N\right)\hat{\imath}
      +\left(N-m_A g\cos\theta\right)\hat{\jmath}
      =m_A a_A\left(\cos\theta\,\hat{\imath}+\sin\theta\,\hat{\jmath}\right)
      \]
  - distractor 3: |
      \[
      \left(T+m_A g\sin\theta-\mu_k N\right)\hat{\imath}
      +\left(N-m_A g\cos\theta\right)\hat{\jmath}
      =m_A a_A\hat{\imath}
      \]
  - distractor 4: |
      \[
      \left(T-m_A g\sin\theta+\mu_k N\right)\hat{\imath}
      +\left(N-m_A g\cos\theta\right)\hat{\jmath}
      =m_A a_A\hat{\imath}
      \]
  - choice variations: |
      Keep the six choices in the input order. Tension is +T along x in both
      scenarios. In possible answers 1 and 2 and distractors 2 and 4, use the
      correct parallel weight term: -m_A g sin(theta) in scenario 1 and
      +m_A g sin(theta) in scenario 2. Distractor 1 omits that term;
      distractor 3 uses its opposite sign.
      In both possible answers and distractors 1, 2, and 3, friction is
      -mu_k N for rightward (+x) velocity and +mu_k N for leftward (-x) velocity.
      Distractor 4 reverses only that friction sign.
      Every choice has the y-force component N-m_A g cos(theta).
      Possible answer 1 always has +m_A a_A i-hat on the right.
      Possible answer 2 always has -m_A a_A i-hat on the right.
      For distractors 1, 3, and 4, use the actual signed x acceleration on
      the right. Distractor 2 incorrectly projects that acceleration onto
      both inclined axes using cos(theta) and sin(theta), with the actual
      acceleration's overall sign.
      Define every symbol in every question. Keep construction rules and
      internal kinematic-state identifiers out of student-facing content.
      Distractors: 1 omits parallel gravity; 2 introduces spurious normal
      acceleration; 3 reverses parallel gravity; 4 reverses kinetic friction.
  - correct answer: |
      Apply Newton's second law to A. Tension points toward the right-end
      pulley, gravity's parallel component points downhill, the normal force
      points outward, kinetic friction opposes instantaneous velocity, and
      acceleration is inferred from the stated velocity and whether A is
      speeding up or slowing down, then signed according to the displayed +x direction.
      Normal acceleration is zero.
      Choose possible answer 1 for rightward (+x) acceleration and possible
      answer 2 for leftward (-x) acceleration.
      Scenario 1: uphill_speeding_up -> 1; uphill_slowing_down -> 2;
      downhill_speeding_up -> 2; downhill_slowing_down -> 1.
      Scenario 2: downhill_speeding_up -> 1;
      downhill_slowing_down -> 2.
      Exactly one choice is correct for every allowed item.

