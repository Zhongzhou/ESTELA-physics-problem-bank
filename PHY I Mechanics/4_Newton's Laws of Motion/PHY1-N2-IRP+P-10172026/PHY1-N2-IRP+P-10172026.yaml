        <h3>Force components and Newton’s second law</h3>
        <p>Tension points toward the pulley, along \(+x\). Gravity’s parallel component points downhill, along \(+x\). Kinetic friction opposes the velocity and points along \(-x\). The normal force points along \(+y\), while gravity’s perpendicular component points along \(-y\). The angle between gravity and \(-y\) is \(\theta\), giving \(F_{g,y}=-m_A g\cos\theta\).</p>
        <table style="border-collapse: collapse; border: 1px solid #777;"><thead><tr><th scope="col" style="border: 1px solid #777; padding: 4px 8px;">Force on A</th><th scope="col" style="border: 1px solid #777; padding: 4px 8px;">x component</th><th scope="col" style="border: 1px solid #777; padding: 4px 8px;">y component</th></tr></thead><tbody><tr><th scope="row" style="border: 1px solid #777; padding: 4px 8px;">Tension</th><td style="border: 1px solid #777; padding: 4px 8px;">\(+T\)</td><td style="border: 1px solid #777; padding: 4px 8px;">\(0\)</td></tr><tr><th scope="row" style="border: 1px solid #777; padding: 4px 8px;">Weight</th><td style="border: 1px solid #777; padding: 4px 8px;">\(+m_A g\sin\theta\)</td><td style="border: 1px solid #777; padding: 4px 8px;">\(-m_A g\cos\theta\)</td></tr><tr><th scope="row" style="border: 1px solid #777; padding: 4px 8px;">Normal force</th><td style="border: 1px solid #777; padding: 4px 8px;">\(0\)</td><td style="border: 1px solid #777; padding: 4px 8px;">\(+N\)</td></tr><tr><th scope="row" style="border: 1px solid #777; padding: 4px 8px;">Kinetic friction</th><td style="border: 1px solid #777; padding: 4px 8px;">\(-\mu_k N\)</td><td style="border: 1px solid #777; padding: 4px 8px;">\(0\)</td></tr></tbody></table>
