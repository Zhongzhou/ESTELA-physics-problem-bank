    figure_alt: 'Object A, a brass block, is on the left on a rough incline sloping upward to the right. A rope runs parallel to the incline to a fixed pulley at the upper right end, then vertically down to object B, a freely hanging steel weight, on the right. The angle theta is marked between the surface and a horizontal reference. The axes originate on A: positive x points right along the incline and positive y points perpendicular to and outward from the surface.'
