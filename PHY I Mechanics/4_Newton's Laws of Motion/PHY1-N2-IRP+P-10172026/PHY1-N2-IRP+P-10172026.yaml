        <p>The component equations are</p>
        <div>\[T+m_A g\sin\theta-\mu_k N=m_A a_A,\qquad N-m_A g\cos\theta=0.\]</div>
- multiple_choice:
    id: q-D3-downhill-slowing-down
    title: 'D3: Wooden stage prop — downhill, slowing down'
    points: 1
    text: |-
      <p>In a theater workshop, a wooden stage prop A of mass \(m_A\) slides on a rough scenic ramp above an open backstage pit. The ramp falls to the right at an angle \(\theta\) below the horizontal. A taut, massless, inextensible rope runs parallel to the ramp from A, passes over a fixed, frictionless, massless pulley at the lower right end, and then runs vertically downward to a freely hanging counterweight B of mass \(m_B\). The hanging rope and object B clear the ramp and its support.</p>
      <p>The coefficient of kinetic friction between the prop and the ramp is \(\mu_k\). <strong>At the instant shown, the prop is sliding down the incline and slowing down.</strong> It remains in contact with the ramp.</p>
      <p>Let \(T\) be the rope-tension magnitude, \(N\) the normal-force magnitude on A, \(g\) the magnitude of gravitational acceleration, and \(a_A&gt;0\) the magnitude of A’s acceleration. The unit vectors \(\hat{\imath}\) and \(\hat{\jmath}\) point along the positive \(x\) and \(y\) axes shown in the figure.</p>
      <p><strong>Which equation correctly expresses Newton’s second law for object A in the coordinate system shown?</strong></p>
    figure: media/D3.png
    figure_alt: 'Object A, a wooden stage prop, is on the left on a rough incline sloping downward to the right. A rope runs parallel to the incline to a fixed pulley at the lower right end, then vertically down to object B, a freely hanging counterweight, on the right. The angle theta is marked between the surface and a horizontal reference. The axes originate on A: positive x points right along the incline and positive y points perpendicular to and outward from the surface.'
    answers:
    - answer:
        text: |-
          <div>\[\left(T+m_A g\sin\theta-\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=m_A a_A\hat{\imath}\]</div>
        correct: false
        feedback: |-
          <p>The acceleration sign is reversed. A is moving down the incline and slowing down, so \(\vec{a}_A=-a_A\hat{\imath}\).</p>
    - answer:
        text: |-
          <div>\[\left(T+m_A g\sin\theta-\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=-m_A a_A\hat{\imath}\]</div>
        correct: true
        feedback: |-
          <p>Correct. Tension is along \(+x\), parallel gravity is along \(+x\), friction is along \(-x\), and acceleration is along \(-x\).</p>
    - answer:
        text: |-
          <div>\[\left(T-\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=-m_A a_A\hat{\imath}\]</div>
        correct: false
        feedback: |-
          <p>The parallel component of gravity is missing. Its \(x\) component is \(+m_A g\sin\theta\).</p>
    - answer:
        text: |-
          <div>\[\left(T+m_A g\sin\theta-\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=-m_A a_A\left(\cos\theta\,\hat{\imath}+\sin\theta\,\hat{\jmath}\right)\]</div>
        correct: false
        feedback: |-
          <p>The acceleration has been projected using the incline angle even though the axes are already aligned with the incline. A stays on the straight surface, so \(a_y=0\).</p>
    - answer:
        text: |-
          <div>\[\left(T-m_A g\sin\theta-\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=-m_A a_A\hat{\imath}\]</div>
        correct: false
        feedback: |-
          <p>The parallel component of gravity has the wrong sign. Gravity points downhill, along \(+x\), giving \(F_{g,x}=+m_A g\sin\theta\).</p>
    - answer:
        text: |-
          <div>\[\left(T+m_A g\sin\theta+\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=-m_A a_A\hat{\imath}\]</div>
        correct: false
        feedback: |-
          <p>The friction sign is reversed. Kinetic friction opposes A’s velocity, so it points along \(-x\), with \(f_{k,x}=-\mu_k N\).</p>
    feedback:
      general: |-
        <h3>Free-body diagram and motion</h3>
        <p>The four force arrows act on A. The solid arrow above A shows its velocity; the dashed arrow shows its acceleration.</p>
        <figure><img src="$IMS-CC-FILEBASE$/media/fbd-D-downhill-slowing-down.png" alt="Free-body diagram of isolated object A. Tension points downhill toward the right, the normal force is perpendicular to and outward from the incline, weight points vertically down, and kinetic friction points uphill, opposite the motion. Above A, a solid velocity arrow points downhill toward the right; a dashed acceleration arrow points uphill toward the left. The coordinate axes originate on A: positive x points right along the incline and positive y points perpendicular and outward. A dotted guide extends in the negative y direction. The acute angle theta is marked between this negative y direction and the vertically downward weight." width="640" /><figcaption>Solid arrow: velocity. Dashed arrow: acceleration. Arrow lengths are schematic.</figcaption></figure>
        <p>A moves downhill, along \(+x\), and is slowing down. Its acceleration therefore points uphill, along \(-x\). Let \(v_A&gt;0\) denote its speed.</p>
        <div>\[\vec{v}_A=v_A\hat{\imath},\qquad\vec{a}_A=-a_A\hat{\imath}.\]</div>
        <h3>Force components and Newton’s second law</h3>
        <p>Tension points toward the pulley, along \(+x\). Gravity’s parallel component points downhill, along \(+x\). Kinetic friction opposes the velocity and points along \(-x\). The normal force points along \(+y\), while gravity’s perpendicular component points along \(-y\). The angle between gravity and \(-y\) is \(\theta\), giving \(F_{g,y}=-m_A g\cos\theta\).</p>
