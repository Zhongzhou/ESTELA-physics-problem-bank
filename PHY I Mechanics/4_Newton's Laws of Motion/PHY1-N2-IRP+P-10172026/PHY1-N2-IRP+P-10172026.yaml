        <p>The straight surface constrains the perpendicular acceleration to zero: \(a_y=0\).</p>
        <div>\[N-m_A g\cos\theta=m_A a_y=0.\]</div>
        <p>Summing the external force vectors gives</p>
        <div>\[\left(T+m_A g\sin\theta-\mu_k N\right)\hat{\imath}+\left(N-m_A g\cos\theta\right)\hat{\jmath}=-m_A a_A\hat{\imath}\]</div>
        <p>The component equations are</p>
