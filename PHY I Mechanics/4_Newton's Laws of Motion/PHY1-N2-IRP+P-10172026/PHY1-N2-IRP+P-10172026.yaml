- multiple_choice:
    id: q-U1-downhill-slowing-down
    title: 'U1: Brass block — downhill, slowing down'
    points: 1
    text: |-
      <p>In a physics laboratory, a brass block A of mass \(m_A\) slides on a rough inclined board on a laboratory bench. The board rises to the right at an angle \(\theta\) above the horizontal. A taut, massless, inextensible rope runs parallel to the board from A, passes over a fixed, frictionless, massless pulley at the upper right end, and then runs vertically downward to a freely hanging steel weight B of mass \(m_B\).</p>
      <p>The coefficient of kinetic friction between the block and the board is \(\mu_k\). <strong>At the instant shown, the block is sliding down the incline and slowing down.</strong> It remains in contact with the board.</p>
      <p>Let \(T\) be the rope-tension magnitude, \(N\) the normal-force magnitude on A, \(g\) the magnitude of gravitational acceleration, and \(a_A&gt;0\) the magnitude of A’s acceleration. The unit vectors \(\hat{\imath}\) and \(\hat{\jmath}\) point along the positive \(x\) and \(y\) axes shown in the figure.</p>
      <p><strong>Which equation correctly expresses Newton’s second law for object A in the coordinate system shown?</strong></p>
