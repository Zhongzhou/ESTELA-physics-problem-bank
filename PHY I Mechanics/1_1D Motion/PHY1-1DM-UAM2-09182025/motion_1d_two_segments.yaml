              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}_2\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(-2.5\,\mathrm{m/s^2}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Net acceleration is upward</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t_2\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">
                  <strong>?</strong>
