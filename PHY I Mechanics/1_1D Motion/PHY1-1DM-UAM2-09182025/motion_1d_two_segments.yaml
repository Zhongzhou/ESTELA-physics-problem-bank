          <div>\[\vec{v}_{f1}=3.0\,\mathrm{m/s}\,\hat{j}\]</div>
          <div>\[\Delta t_1=\frac{3.0\,\mathrm{m/s}-0\,\mathrm{m/s}}{1.2\,\mathrm{m/s^2}}=2.5\,\mathrm{s}\]</div>
          <h4>Segment 2</h4>
          <div>\[\Delta t_2=\frac{0\,\mathrm{m/s}-3.0\,\mathrm{m/s}}{-1.2\,\mathrm{m/s^2}}=2.5\,\mathrm{s}\]</div>
