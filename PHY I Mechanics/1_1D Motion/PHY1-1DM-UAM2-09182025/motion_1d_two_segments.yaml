  - numerical:
      id: q10
      title: Scenario P3 — Package drop (long freefall, slower parachute braking)
      points: 1
      text: |-
        <p>A drone releases a package from rest. It freefalls vertically for \(490\,\mathrm{m}\) under constant gravitational acceleration. Then the parachute deploys, providing a uniform deceleration of \(2.5\,\mathrm{m/s^2}\) while the package descends another \(200\,\mathrm{m}\) until reaching the ground. Determine the total time from release to landing in SI units to one decimal place.</p>
      answer:
        value: 12.1
        margin_type: percent
        tolerance: 2
      feedback:
        general: |-
          <h3>1. Identify the motion segments and the target quantity</h3>
          <p>This is motion along one dimension with a constant acceleration within each segment, so the constant-acceleration kinematic equations apply separately to the two segments. The acceleration may change at the transition.</p>
          <ul>
          <li><strong>Segment 1:</strong> From release at rest to parachute deployment after falling \(490\,\mathrm{m}\).</li>
          <li><strong>Segment 2:</strong> From parachute deployment to first ground contact after descending another \(200\,\mathrm{m}\). The problem does not specify a stop at ground contact.</li>
          </ul>
          <p><strong>Given:</strong> The initial rest condition, both downward displacements, and the constant net upward acceleration during parachute braking.</p>
          <p><strong>Find:</strong> The elapsed time from release to first ground contact.</p>
          <h3>2. Choose the coordinate system</h3>
          <p>Choose the positive \(y\)-axis downward, in the direction of the descent, with unit vector \(\hat{j}\). Use the initial position as the origin. Signed components and vectors are related by \(\vec{v}=v_y\hat{j}\), \(\vec{a}=a_y\hat{j}\), and \(\Delta\vec{r}=\Delta y\hat{j}\).</p>
          <p>The velocity is continuous at the transition: \(\vec{v}_{i2}=\vec{v}_{f1}\). Speed is \(|\vec{v}|=|v_y|\); a requested magnitude is nonnegative.</p>
