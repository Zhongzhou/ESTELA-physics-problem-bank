  - numerical:
      id: q9
      title: Scenario P2 — Package drop (moderate freefall, required parachute deceleration)
      points: 1
      text: |-
        <p>A drone releases a package from rest. It falls \(245\,\mathrm{m}\) straight down under the influence of Earth&#x27;s gravity before the parachute opens. Once open, the chute slows the package uniformly over \(15.0\,\mathrm{s}\) so that it arrives at the ground with zero vertical velocity. What constant acceleration must the parachute provide to achieve this safe landing? Report its magnitude in SI units to three significant figures.</p>
      answer:
        value: 4.62
        margin_type: percent
        tolerance: 2
      feedback:
        general: |-
          <h3>1. Identify the motion segments and the target quantity</h3>
          <p>This is motion along one dimension with a constant acceleration within each segment, so the constant-acceleration kinematic equations apply separately to the two segments. The acceleration may change at the transition.</p>
          <ul>
          <li><strong>Segment 1:</strong> From release at rest to parachute deployment after falling \(245\,\mathrm{m}\).</li>
          <li><strong>Segment 2:</strong> From parachute deployment to rest at ground contact \(15.0\,\mathrm{s}\) later.</li>
          </ul>
          <p><strong>Given:</strong> The initial rest condition, the freefall displacement, the braking time, and the final rest condition.</p>
          <p><strong>Find:</strong> The magnitude of the constant net acceleration during the parachute-braking segment.</p>
          <h3>2. Choose the coordinate system</h3>
          <p>Choose the positive \(y\)-axis downward, in the direction of the descent, with unit vector \(\hat{j}\). Use the initial position as the origin. Signed components and vectors are related by \(\vec{v}=v_y\hat{j}\), \(\vec{a}=a_y\hat{j}\), and \(\Delta\vec{r}=\Delta y\hat{j}\).</p>
          <p>The velocity is continuous at the transition: \(\vec{v}_{i2}=\vec{v}_{f1}\). Speed is \(|\vec{v}|=|v_y|\); a requested magnitude is nonnegative.</p>
          <h3>3. List the kinematic variables</h3>
          <div style="overflow-x: auto;">
          <table style="border-collapse: collapse; width: 100%;">
            <caption>Segment 1: Release to parachute deployment</caption>
            <thead>
              <tr>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}_1\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(245\,\mathrm{m}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Given</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_{i1}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(0\,\mathrm{m/s}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Released from rest</td>
