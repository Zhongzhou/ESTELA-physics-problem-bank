          <p>Rest conditions and zero acceleration are exact idealizations. Retain guard digits in intermediate calculations; extra intermediate digits do not state the precision of a final answer.</p>
          <h3>4. Select equations and isolate the unknowns</h3>
          <div>\[v_{f1,y}=+\sqrt{2g\Delta y_1},\qquad\Delta t_1=\frac{v_{f1,y}}{g}=\sqrt{\frac{2\Delta y_1}{g}}\]</div>
          <div>\[v_{f2,y}=+\sqrt{v_{f1,y}^2+2a_{2,y}\Delta y_2}\]</div>
          <p>Use the positive square root for first ground contact because the package is still moving downward. Taking the negative root would describe a later event after a reversal in an extrapolated motion.</p>
          <div>\[\Delta t_2=\frac{v_{f2,y}-v_{f1,y}}{a_{2,y}}=\frac{2\Delta y_2}{v_{f1,y}+v_{f2,y}}\]</div>
          <div>\[t_{\mathrm{tot}}=\Delta t_1+\Delta t_2\]</div>
          <h3>5. Substitute values with units</h3>
          <h4>Segment 1</h4>
          <div>\[\vec{v}_{f1}=\sqrt{2g(490\,\mathrm{m})}\,\hat{j}=98\,\mathrm{m/s}\,\hat{j}\]</div>
          <div>\[\Delta t_1=\sqrt{\frac{2(490\,\mathrm{m})}{g}}=10\,\mathrm{s}\]</div>
          <h4>Segment 2</h4>
          <div>\[v_{f2,y}=\sqrt{(98\,\mathrm{m/s})^2+2(-2.5\,\mathrm{m/s^2})(200\,\mathrm{m})}=\sqrt{8604\,\mathrm{m^2/s^2}}\]</div>
          <div>\[\vec{v}_{f2}\approx92.7577490024\,\mathrm{m/s}\,\hat{j}\]</div>
          <p>Keep the square root unrounded when finding the second time interval. The average-velocity form avoids subtracting two similar speeds.</p>
          <div>\[\Delta t_2=\frac{2(200\,\mathrm{m})}{98\,\mathrm{m/s}+\sqrt{8604\,\mathrm{m^2/s^2}}}\approx2.096900399\,\mathrm{s}\]</div>
          <h4>Combine the segments</h4>
          <div>\[t_{\mathrm{tot}}=10\,\mathrm{s}+2.096900399\ldots\,\mathrm{s}=12.096900399\ldots\,\mathrm{s}\]</div>
          <h3>6. Report the requested result</h3>
          <p>Round the total time to the requested one decimal place after completing both segments with guard digits.</p>
          <div>\[\boxed{t_{\mathrm{tot}}\approx12.1\,\mathrm{s}}\]</div>
          <p>The package reaches the ground with a nonzero downward velocity. The final event is first ground contact; no extra stopping segment is included.</p>
        on_correct: Correct. Review the solution to check your segment definitions, signs, units, and final precision.
        on_incorrect: Try again. Treat the two segments separately, carry the transition velocity into segment 2,
          and round only the final result.
