questions:

  - numerical:
      id: q1
      title: Scenario 1a — Elevator (upward, symmetric accel then decel)
      points: 1
      text: |-
        <p>A modern elevator departs the lobby and follows a comfort profile: it speeds up uniformly for \(2.5\,\mathrm{s}\) at \(1.2\,\mathrm{m/s^2}\) starting from rest, then immediately applies a symmetric constant deceleration of \(1.2\,\mathrm{m/s^2}\) for another \(2.5\,\mathrm{s}\) to arrive level with the target floor. Assuming vertical motion only, determine the total upward rise of the car in SI units.</p>
        <p>Report your answer in meters to two significant figures.</p>
      answer:
        value: 7.5
        margin_type: percent
        tolerance: 2
      feedback:
        general: |-
          <h3>1. Identify the motion segments and the target quantity</h3>
          <p>This is motion along one dimension with a constant acceleration within each segment, so the constant-acceleration kinematic equations apply separately to the two segments. The acceleration may change at the transition.</p>
          <ul>
          <li><strong>Segment 1:</strong> From departure at rest in the lobby to the instant upward acceleration ends, after the first \(2.5\,\mathrm{s}\).</li>
          <li><strong>Segment 2:</strong> From the instant braking begins to arrival at rest at the target floor, after the next \(2.5\,\mathrm{s}\).</li>
          </ul>
          <p><strong>Given:</strong> The initial rest condition, both acceleration magnitudes, and both time intervals.</p>
          <p><strong>Find:</strong> The magnitude of the total upward displacement. There is no reversal, so this also equals the total distance traveled.</p>
          <h3>2. Choose the coordinate system</h3>
          <p>Choose the positive \(y\)-axis upward along the elevator shaft, with unit vector \(\hat{j}\). Use the initial position as the origin. Signed components and vectors are related by \(\vec{v}=v_y\hat{j}\), \(\vec{a}=a_y\hat{j}\), and \(\Delta\vec{r}=\Delta y\hat{j}\).</p>
          <p>The velocity is continuous at the transition: \(\vec{v}_{i2}=\vec{v}_{f1}\). Speed is \(|\vec{v}|=|v_y|\); a requested magnitude is nonnegative.</p>
          <h3>3. List the kinematic variables</h3>
          <div style="overflow-x: auto;">
          <table style="border-collapse: collapse; width: 100%;">
            <caption>Segment 1: Departure to the start of braking</caption>
            <thead>
              <tr>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}_1\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">
                  <strong>?</strong>
                </td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be determined</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_{i1}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(0\,\mathrm{m/s}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Starts from rest</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_{f1}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">
                  <strong>?</strong>
                </td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be determined</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}_1\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(1.2\,\mathrm{m/s^2}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Given</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t_1\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(2.5\,\mathrm{s}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Given</td>
              </tr>
            </tbody>
          </table>
          </div>
          <div style="overflow-x: auto;">
          <table style="border-collapse: collapse; width: 100%;">
            <caption>Segment 2: Start of braking to rest at the floor</caption>
            <thead>
              <tr>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
                <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}_2\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">
                  <strong>?</strong>
                </td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be determined</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_{i2}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_{f1}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Continuity at the transition</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_{f2}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(0\,\mathrm{m/s}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Stops at the floor</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}_2\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(-1.2\,\mathrm{m/s^2}\,\hat{j}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Opposite the upward velocity</td>
              </tr>
              <tr>
                <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t_2\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(2.5\,\mathrm{s}\)</span></td>
                <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Given</td>
              </tr>
            </tbody>
          </table>
          </div>
          <p>Rest conditions and zero acceleration are exact idealizations. Retain guard digits in intermediate calculations; extra intermediate digits do not state the precision of a final answer.</p>
          <h3>4. Select equations and isolate the unknowns</h3>
          <p>First find the transition velocity and the displacement in each segment.</p>
          <div>\[\vec{v}_{f1}=\vec{v}_{i1}+\vec{a}_1\Delta t_1\]</div>
          <div>\[\Delta\vec{r}_k=\vec{v}_{ik}\Delta t_k+\frac12\vec{a}_k(\Delta t_k)^2\qquad(k=1,2)\]</div>
          <div>\[\Delta\vec{r}_{\mathrm{tot}}=\Delta\vec{r}_1+\Delta\vec{r}_2\]</div>
          <h3>5. Substitute values with units</h3>
          <h4>Segment 1</h4>
          <div>\[\vec{v}_{f1}=[0\,\mathrm{m/s}+(1.2\,\mathrm{m/s^2})(2.5\,\mathrm{s})]\hat{j}=3.0\,\mathrm{m/s}\,\hat{j}\]</div>
          <div>\[\Delta\vec{r}_1=\left[(0\,\mathrm{m/s})(2.5\,\mathrm{s})+\frac12(1.2\,\mathrm{m/s^2})(2.5\,\mathrm{s})^2\right]\hat{j}=3.75\,\mathrm{m}\,\hat{j}\]</div>
          <h4>Segment 2</h4>
          <div>\[\Delta\vec{r}_2=\left[(3.0\,\mathrm{m/s})(2.5\,\mathrm{s})+\frac12(-1.2\,\mathrm{m/s^2})(2.5\,\mathrm{s})^2\right]\hat{j}=3.75\,\mathrm{m}\,\hat{j}\]</div>
          <h4>Combine the segments</h4>
          <div>\[\Delta\vec{r}_{\mathrm{tot}}=(3.75\,\mathrm{m}+3.75\,\mathrm{m})\hat{j}=7.5\,\mathrm{m}\,\hat{j}\]</div>
          <h3>6. Report the requested result</h3>
          <p>Both the acceleration magnitudes and time intervals have two significant figures. Report the upward rise to two significant figures.</p>
          <div>\[\boxed{|\Delta\vec{r}_{\mathrm{tot}}|=7.5\,\mathrm{m}}\]</div>
        on_correct: Correct. Review the solution to check your segment definitions, signs, units, and final precision.
        on_incorrect: Try again. Treat the two segments separately, carry the transition velocity into segment 2,
          and round only the final result.

  # Original 5.0 s reporting precision retained.

  - numerical:
      id: q2
      title: Scenario 1b — Elevator (upward, symmetric accel then decel)
      points: 1
      text: |-
        <p>The elevator’s controller targets a smooth stop exactly at the floor. It leaves the lobby, starting from rest, and covers \(3.75\,\mathrm{m}\) while accelerating uniformly at \(1.2\,\mathrm{m/s^2}\). It then applies a constant deceleration of \(1.2\,\mathrm{m/s^2}\) to come to rest at the landing. Compute the total travel time in SI units from departure to level stop.</p>
        <p>Report your answer in seconds to two significant figures.</p>
      answer:
        value: 5.0
        margin_type: percent
        tolerance: 2
      feedback:
