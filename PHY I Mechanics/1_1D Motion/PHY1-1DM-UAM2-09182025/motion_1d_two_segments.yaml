          </table>
          </div>
          <p>Rest conditions and zero acceleration are exact idealizations. Retain guard digits in intermediate calculations; extra intermediate digits do not state the precision of a final answer.</p>
          <h3>4. Select equations and isolate the unknowns</h3>
          <p>Use the equation that relates velocity, acceleration, and displacement without time.</p>
          <div>\[v_{f1,x}^2=v_{i1,x}^2+2a_{1,x}\Delta x_1\]</div>
          <div>\[v_{f2,x}^2=v_{f1,x}^2+2a_{2,x}\Delta x_2\]</div>
          <p>Substitute the first relation into the second before taking the square root. This avoids rounding the transition speed.</p>
          <div>\[v_{f2,x}=+\sqrt{v_{i1,x}^2+2a_{1,x}\Delta x_1+2a_{2,x}\Delta x_2}\]</div>
          <h3>5. Substitute values with units</h3>
          <h4>Segment 1</h4>
          <div>\[v_{f1,x}^2=(0\,\mathrm{m/s})^2+2(0.50\,\mathrm{m/s^2})(75\,\mathrm{m})=75\,\mathrm{m^2/s^2}\]</div>
          <div>\[\vec{v}_{f1}=\sqrt{75\,\mathrm{m^2/s^2}}\,\hat{i}\approx8.660254\,\mathrm{m/s}\,\hat{i}\]</div>
          <h4>Segment 2</h4>
          <div>\[v_{f2,x}^2=75\,\mathrm{m^2/s^2}+2(0.80\,\mathrm{m/s^2})(25\,\mathrm{m})=115\,\mathrm{m^2/s^2}\]</div>
          <div>\[\vec{v}_{f2}=\sqrt{115\,\mathrm{m^2/s^2}}\,\hat{i}\approx10.723805\,\mathrm{m/s}\,\hat{i}\]</div>
          <h4>Combine the segments</h4>
          <p>The two displacement contributions to the change in squared speed have already been combined. Take the magnitude of the final velocity; do not add the two segment speeds.</p>
          <h3>6. Report the requested result</h3>
          <p>Both accelerations and both segment displacements have two significant figures. Round only the final speed to two significant figures.</p>
          <div>\[\boxed{|\vec{v}_{f2}|\approx11\,\mathrm{m/s}}\]</div>
        on_correct: Correct. Review the solution to check your segment definitions, signs, units, and final precision.
        on_incorrect: Try again. Treat the two segments separately, carry the transition velocity into segment 2,
          and round only the final result.

