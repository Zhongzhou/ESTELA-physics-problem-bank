          <li><strong>Segment 2:</strong> From the start of braking at that position to rest at the landing.</li>
          </ul>
          <p><strong>Given:</strong> The initial and final rest conditions, the first displacement, and both acceleration magnitudes.</p>
          <p><strong>Find:</strong> The total elapsed time from departure to rest at the landing.</p>
