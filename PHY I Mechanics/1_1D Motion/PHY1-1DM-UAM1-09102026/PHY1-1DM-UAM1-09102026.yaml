# Numerical problem bank: 17 independent questions, 1 point each.
# HTML strings use MathJax inline \(...\) and display \[...\] delimiters.
# Answer values are numeric and use the units and rounding requested in each problem.
bank_info:
  title: Motion with Constant Acceleration Along a Straight Line
  bank_id: PHY1-1DM-UAM1-09102026
  description: |
    Seventeen independent numerical problems on straight-line motion with constant acceleration.
    Each problem supplies three kinematic quantities explicitly or implicitly and asks for one other quantity.
    Complete worked solutions identify the motion segment, use vector notation and unit vectors, organize the five kinematic variables, select and rearrange an equation, and substitute values with units.
    Problem text and solution feedback are HTML fragments with standard MathJax delimiters.
  date created: 09-11-2026
  status: ready # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field.
  learning objectives:
  - 1DM-KE-1
  generation prompts:
  - prompt 1: |
      Develop independent real-life examples of motion with constant acceleration along a straight segment, including five examples from scientific settings.
      For each of the resulting 17 scenarios, identify central explicit or implicit kinematic quantities and assign realistic values.
      Use the instructor-selected third given and requested unknown, including the agreed numerical revisions and displacement as the target for Problem 16.
  - prompt 2: |
      Write standalone word problems with rich context and ordinary language for the kinematic quantities.
      State directions in words and ask for speed, distance, elapsed time, or acceleration magnitude.
      Do not provide Earth's gravitational acceleration numerically in the problem statements. Specify answer units and significant figures or decimal places for each question.
  - prompt 3: |
      Write a five-part solution for every problem: identify the initial and final events of the selected segment and the physics; tabulate the five kinematic variables; select an equation; rearrange it algebraically; and substitute values with units.
      Use vector notation and unit vectors, work with signed components where required, and report the requested scalar or magnitude with the specified rounding.
  - formatting prompt: |
      Follow the structure of Problem-bank-template-num.yaml.
      Place the HTML problem statement in text and the complete HTML worked solution in feedback.general.
      Use standard MathJax inline delimiters \(...\) and display delimiters \[...\].
      Set each numerical question to 1 point, use margin_type: percent and tolerance: 5, and store the rounded numerical answer in answer.value using the units requested in that question.
  updates:
  - update 1: '09-11-2026: Created the 17-question numerical bank with the agreed values, five-part vector solutions, MathJax
      formatting, and confirmed grading settings.'
  associated data:
  - problem statements: Constant_Acceleration_Word_Problems.md
  - worked solutions: Constant_Acceleration_Worked_Solutions.md
  - numerical template: Problem-bank-template-num.yaml
  generation details:
    model: OpenAI Astra
    version: 5.6
    last updated: 09-11-2026
  authors:
  - O. Moussa
questions:
- numerical:
    id: q1
    title: 'Problem 1: Pulling away from a traffic light'
    points: 1
    text: |
      <p>A driver is waiting at a red light on a straight, level road beside a public library. When the light turns green, the car pulls away from rest and travels 36.0 m during the next 6.0 s. Its speed increases at a constant rate throughout this stretch. How fast is the car moving at the end of those 6.0 s? Report the speed in meters per second to <strong>two significant figures</strong>.</p>
      </div>
    answer:
      value: 12
      margin_type: percent
      tolerance: 5
    feedback:
      general: |
        <h3>1. Identify the motion segment, physics, and requested quantity</h3>
        <ul>
          <li><strong>Initial event:</strong> The car begins moving from rest after the light turns green.</li>
          <li><strong>Final event:</strong> The car completes the next 6.0 s of motion, having traveled 36.0 m.</li>
        </ul>
        <p>This is motion with <strong>constant acceleration along a straight segment</strong>, so the kinematic equations apply. The car starts from rest and travels 36.0 m in 6.0 s.</p>
        <p>Choose the positive <span class="math-inline">\(x\)</span>-axis along the car's forward motion, with unit vector <span class="math-inline">\(\hat{\mathbf{i}}\)</span>.</p>
        <p>The requested ending speed is the magnitude of the final instantaneous velocity vector, <span class="math-inline">\(|\vec{v}_f|\)</span>.</p>
        <h3>2. Organize the kinematic variables</h3>
        <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic variables for Problem 1</caption>
          <thead>
            <tr>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((36.0\,\mathrm{m})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Distance explicitly given; the vector direction follows from the chosen axis and motion.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_i\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((0\,\mathrm{m/s})\hat{\mathbf{i}}=\vec{0}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Implicit: the car starts from rest.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_f\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><strong>?</strong></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be solved for. The question requests its magnitude.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not given</td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Constant; numerical value not given or needed.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(6.0\,\mathrm{s}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Explicitly given; time is a scalar.</td>
            </tr>
          </tbody>
        </table>
        <h3>3. Select a kinematic equation</h3>
        <p>We know <span class="math-inline">\(\Delta\vec{r}\)</span>, <span class="math-inline">\(\vec{v}_i\)</span>, and <span class="math-inline">\(\Delta t\)</span>, and need <span class="math-inline">\(\vec{v}_f\)</span>. The average-velocity equation avoids the unknown acceleration:</p>
        <div class="math-display">\[
        \Delta\vec{r}=\frac{\vec{v}_i+\vec{v}_f}{2}\,\Delta t.
        \]</div>
        <h3>4. Solve algebraically for the unknown</h3>
        <p>Multiply by 2, divide by the scalar <span class="math-inline">\(\Delta t\)</span>, and subtract <span class="math-inline">\(\vec{v}_i\)</span>:</p>
        <div class="math-display">\[
        \begin{aligned}
        \Delta\vec{r}&amp;=\frac{\vec{v}_i+\vec{v}_f}{2}\Delta t\\[3pt]
        2\Delta\vec{r}&amp;=(\vec{v}_i+\vec{v}_f)\Delta t\\[3pt]
        \frac{2\Delta\vec{r}}{\Delta t}&amp;=\vec{v}_i+\vec{v}_f\\[3pt]
        \vec{v}_f&amp;=\frac{2\Delta\vec{r}}{\Delta t}-\vec{v}_i.
        \end{aligned}
        \]</div>
        <h3>5. Substitute values with units and calculate</h3>
        <div class="math-display">\[
        \begin{aligned}
        \vec{v}_f&amp;=\frac{2(36.0\,\mathrm{m})\hat{\mathbf{i}}}{6.0\,\mathrm{s}}-(0\,\mathrm{m/s})\hat{\mathbf{i}}\\[3pt]
        &amp;=(12\,\mathrm{m/s})\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <p>The velocity points forward. Taking its magnitude removes the direction from the requested speed.</p>
        <div class="math-display">\[
        |\vec{v}_f|=\boxed{12\,\mathrm{m/s}}
        \]</div>
        <p><strong>Rounding:</strong> Two significant figures.</p>
        </div>
      on_correct: Good job!
      on_incorrect: Try again!
- numerical:
    id: q2
    title: 'Problem 2: A smooth stop for a city bus'
    points: 1
    text: |
      <p>A city bus is approaching a stop on a straight, level street, where passengers are waiting to board. The bus is traveling at 10.0 m/s when the driver begins braking. To make the stop comfortable for the standing passengers, the driver reduces the bus's speed at a constant rate until it comes to rest, traveling 35.0 m after braking begins. What is the magnitude of the bus's acceleration during braking? Report your answer in <span class="math-inline">\(\mathrm{m/s^2}\)</span> to <strong>three significant figures</strong>.</p>
    answer:
      value: 1.43
      margin_type: percent
      tolerance: 5
    feedback:
      general: |
        <h3>1. Identify the motion segment, physics, and requested quantity</h3>
        <ul>
          <li><strong>Initial event:</strong> The driver begins braking while the bus is moving at 10.0 m/s.</li>
          <li><strong>Final event:</strong> The bus first comes to rest, 35.0 m farther along the street.</li>
        </ul>
        <p>This is motion with <strong>constant acceleration along a straight segment</strong>, so the kinematic equations apply. The bus enters the braking segment at 10.0 m/s, travels 35.0 m, and stops.</p>
        <p>Choose the positive <span class="math-inline">\(x\)</span>-axis along the bus's forward motion, with unit vector <span class="math-inline">\(\hat{\mathbf{i}}\)</span>.</p>
        <p>The requested quantity is the magnitude of the acceleration vector, <span class="math-inline">\(|\vec{a}|\)</span>. We will determine the vector and then take its magnitude.</p>
        <h3>2. Organize the kinematic variables</h3>
        <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic variables for Problem 2</caption>
          <thead>
            <tr>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((35.0\,\mathrm{m})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Distance explicitly given; the vector direction follows from the chosen axis and motion.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_i\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((10.0\,\mathrm{m/s})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Speed explicitly given; the vector direction follows from the stated motion and chosen axis.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_f\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((0\,\mathrm{m/s})\hat{\mathbf{i}}=\vec{0}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Implicit: the bus comes to rest.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><strong>?</strong></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be solved for. The question requests its magnitude.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not given</td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not required for this calculation.</td>
            </tr>
          </tbody>
        </table>
        <h3>3. Select a kinematic equation</h3>
        <p>We know the displacement and both endpoint velocities, but not the time. Use the time-independent kinematic equation for the signed <span class="math-inline">\(x\)</span>-components. Here <span class="math-inline">\(\vec{v}_i=v_{ix}\hat{\mathbf{i}}\)</span>, <span class="math-inline">\(\vec{v}_f=v_{fx}\hat{\mathbf{i}}\)</span>, and <span class="math-inline">\(\Delta\vec{r}=\Delta x\hat{\mathbf{i}}\)</span>:</p>
        <div class="math-display">\[
        v_{fx}^{\,2}=v_{ix}^{\,2}+2a_x\Delta x.
        \]</div>
        <h3>4. Solve algebraically for the unknown</h3>
        <p>Subtract <span class="math-inline">\(v_{ix}^{\,2}\)</span>, divide by <span class="math-inline">\(2\Delta x\)</span>, and reconstruct the acceleration vector:</p>
        <div class="math-display">\[
        \begin{aligned}
        v_{fx}^{\,2}&amp;=v_{ix}^{\,2}+2a_x\Delta x\\[3pt]
        v_{fx}^{\,2}-v_{ix}^{\,2}&amp;=2a_x\Delta x\\[3pt]
        a_x&amp;=\frac{v_{fx}^{\,2}-v_{ix}^{\,2}}{2\Delta x}\\[3pt]
        \vec{a}&amp;=\left(\frac{v_{fx}^{\,2}-v_{ix}^{\,2}}{2\Delta x}\right)\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <h3>5. Substitute values with units and calculate</h3>
        <div class="math-display">\[
        \begin{aligned}
        a_x&amp;=\frac{(0\,\mathrm{m/s})^2-(10.0\,\mathrm{m/s})^2}{2(35.0\,\mathrm{m})}\\[3pt]
        &amp;=-1.42857\ldots\,\mathrm{m/s^2}\\[3pt]
        \vec{a}&amp;=(-1.42857\ldots\,\mathrm{m/s^2})\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <p>The negative component places the acceleration opposite the bus's motion, as expected while braking.</p>
        <div class="math-display">\[
        |\vec{a}|=\boxed{1.43\,\mathrm{m/s^2}}
        \]</div>
        <p><strong>Rounding:</strong> Three significant figures.</p>
        </div>
      on_correct: Good job!
      on_incorrect: Try again!
- numerical:
    id: q3
    title: 'Problem 3: A commuter train leaving the station area'
    points: 1
    text: |
      <p>A commuter train has already left a downtown station and is entering a straight section of track. A technician reviewing the train's motion records a speed of 8.0 m/s at the beginning of a 20.0 s interval and 16.0 m/s at its end. Throughout this interval, the train's speed increases at a constant rate. How far does the train travel during those 20.0 s? Report the distance in <strong>meters, rounded to the nearest meter</strong>.</p>
      </div>
    answer:
      value: 240
      margin_type: percent
      tolerance: 5
    feedback:
      general: |
        <h3>1. Identify the motion segment, physics, and requested quantity</h3>
        <ul>
          <li><strong>Initial event:</strong> The recorded 20.0 s interval begins, with the train already moving at 8.0 m/s.</li>
          <li><strong>Final event:</strong> That interval ends, with the train moving at 16.0 m/s.</li>
        </ul>
        <p>This is motion with <strong>constant acceleration along a straight segment</strong>, so the kinematic equations apply. The two endpoint speeds are 8.0 m/s and 16.0 m/s, and the interval lasts 20.0 s.</p>
        <p>Choose the positive <span class="math-inline">\(x\)</span>-axis along the train's forward motion, with unit vector <span class="math-inline">\(\hat{\mathbf{i}}\)</span>.</p>
        <p>The motion does not reverse within this segment, so the requested distance is the magnitude of the displacement vector, <span class="math-inline">\(|\Delta\vec{r}|\)</span>.</p>
        <h3>2. Organize the kinematic variables</h3>
        <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic variables for Problem 3</caption>
          <thead>
            <tr>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><strong>?</strong></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be solved for. The question requests its magnitude.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_i\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((8.0\,\mathrm{m/s})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Speed explicitly given; the vector direction follows from the stated motion and chosen axis.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_f\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((16.0\,\mathrm{m/s})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Speed explicitly given; the vector direction follows from the stated motion and chosen axis.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not given</td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Constant; numerical value not given or needed.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(20.0\,\mathrm{s}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Explicitly given; time is a scalar.</td>
            </tr>
          </tbody>
        </table>
        <h3>3. Select a kinematic equation</h3>
        <p>We know both endpoint velocity vectors and the elapsed time. For constant acceleration, the average velocity is the arithmetic mean of the endpoint velocities:</p>
        <div class="math-display">\[
        \frac{\Delta\vec{r}}{\Delta t}=\frac{\vec{v}_i+\vec{v}_f}{2}.
        \]</div>
        <h3>4. Solve algebraically for the unknown</h3>
        <p>Multiply both sides by <span class="math-inline">\(\Delta t\)</span> to isolate the displacement vector:</p>
        <div class="math-display">\[
        \begin{aligned}
        \frac{\Delta\vec{r}}{\Delta t}&amp;=\frac{\vec{v}_i+\vec{v}_f}{2}\\[3pt]
        \Delta\vec{r}&amp;=\frac{\vec{v}_i+\vec{v}_f}{2}\Delta t.
        \end{aligned}
        \]</div>
        <h3>5. Substitute values with units and calculate</h3>
        <div class="math-display">\[
        \begin{aligned}
        \Delta\vec{r}&amp;=\frac{(8.0\,\mathrm{m/s})\hat{\mathbf{i}}+(16.0\,\mathrm{m/s})\hat{\mathbf{i}}}{2}(20.0\,\mathrm{s})\\[3pt]
        &amp;=(240\,\mathrm{m})\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <p>The train travels forward throughout the interval, so distance equals displacement magnitude.</p>
        <div class="math-display">\[
        |\Delta\vec{r}|=\boxed{240\,\mathrm{m}}
        \]</div>
        <p><strong>Rounding:</strong> The nearest meter.</p>
      on_correct: Good job!
      on_incorrect: Try again!
- numerical:
    id: q4
    title: 'Problem 4: An airplane between runway markers'
    points: 1
    text: |
      <p>During a takeoff roll, an airplane passes a painted runway marker while traveling at 45.0 m/s. It continues along the straight runway and passes another marker 250 m farther ahead 5.0 s later. For this short portion of the takeoff roll, assume that its speed increases at a constant rate and that the airplane remains on the runway. How fast is the airplane moving as it passes the second marker? Report the speed in <strong>meters per second, rounded to the nearest whole number</strong>.</p>
      </div>
    answer:
      value: 55
      margin_type: percent
      tolerance: 5
    feedback:
      general: |
        <h3>1. Identify the motion segment, physics, and requested quantity</h3>
        <ul>
          <li><strong>Initial event:</strong> The airplane passes the first runway marker at 45.0 m/s.</li>
          <li><strong>Final event:</strong> It passes the second marker, 250 m farther along the runway, 5.0 s later.</li>
        </ul>
        <p>This is motion with <strong>constant acceleration along a straight segment</strong>, so the kinematic equations apply. The airplane enters the measured segment at 45.0 m/s and covers 250 m in 5.0 s.</p>
        <p>Choose the positive <span class="math-inline">\(x\)</span>-axis forward along the runway, with unit vector <span class="math-inline">\(\hat{\mathbf{i}}\)</span>.</p>
        <p>The requested ending speed is the magnitude of the final instantaneous velocity vector, <span class="math-inline">\(|\vec{v}_f|\)</span>.</p>
        <h3>2. Organize the kinematic variables</h3>
        <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic variables for Problem 4</caption>
          <thead>
            <tr>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((250\,\mathrm{m})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Distance explicitly given; the vector direction follows from the chosen axis and motion.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_i\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((45.0\,\mathrm{m/s})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Speed explicitly given; the vector direction follows from the stated motion and chosen axis.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_f\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><strong>?</strong></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be solved for. The question requests its magnitude.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not given</td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Constant; numerical value not given or needed.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(5.0\,\mathrm{s}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Explicitly given; time is a scalar.</td>
            </tr>
          </tbody>
        </table>
        <h3>3. Select a kinematic equation</h3>
        <p>We know <span class="math-inline">\(\Delta\vec{r}\)</span>, <span class="math-inline">\(\vec{v}_i\)</span>, and <span class="math-inline">\(\Delta t\)</span>, and need <span class="math-inline">\(\vec{v}_f\)</span>. The average-velocity equation avoids the unknown acceleration:</p>
        <div class="math-display">\[
        \Delta\vec{r}=\frac{\vec{v}_i+\vec{v}_f}{2}\,\Delta t.
        \]</div>
        <h3>4. Solve algebraically for the unknown</h3>
        <p>Multiply by 2, divide by the scalar <span class="math-inline">\(\Delta t\)</span>, and subtract <span class="math-inline">\(\vec{v}_i\)</span>:</p>
        <div class="math-display">\[
        \begin{aligned}
        \Delta\vec{r}&amp;=\frac{\vec{v}_i+\vec{v}_f}{2}\Delta t\\[3pt]
        2\Delta\vec{r}&amp;=(\vec{v}_i+\vec{v}_f)\Delta t\\[3pt]
        \frac{2\Delta\vec{r}}{\Delta t}&amp;=\vec{v}_i+\vec{v}_f\\[3pt]
        \vec{v}_f&amp;=\frac{2\Delta\vec{r}}{\Delta t}-\vec{v}_i.
        \end{aligned}
        \]</div>
        <h3>5. Substitute values with units and calculate</h3>
        <div class="math-display">\[
        \begin{aligned}
        \vec{v}_f&amp;=\frac{2(250\,\mathrm{m})\hat{\mathbf{i}}}{5.0\,\mathrm{s}}-(45.0\,\mathrm{m/s})\hat{\mathbf{i}}\\[3pt]
        &amp;=(100-45.0)\,\mathrm{m/s}\;\hat{\mathbf{i}}\\[3pt]
        &amp;=(55\,\mathrm{m/s})\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <p>This is the velocity at the second marker. The question requests its magnitude.</p>
        <div class="math-display">\[
        |\vec{v}_f|=\boxed{55\,\mathrm{m/s}}
        \]</div>
        <p><strong>Rounding:</strong> The nearest whole meter per second.</p>
        </div>
      on_correct: Good job!
      on_incorrect: Try again!
- numerical:
    id: q5
    title: 'Problem 5: A glass elevator rising through an atrium'
    points: 1
    text: |
      <p>A maintenance technician is checking the gentle startup of a glass passenger elevator in a museum atrium. The elevator leaves a lower landing from rest and rises vertically, increasing its speed at a constant rate. After rising 6.0 m, it is moving upward at 1.50 m/s. How much time passes between leaving the landing and reaching that height? Report the time in seconds to <strong>two significant figures</strong>.</p>
      </div>
    answer:
      value: 8.0
      margin_type: percent
      tolerance: 5
    feedback:
      general: |
        <h3>1. Identify the motion segment, physics, and requested quantity</h3>
        <ul>
          <li><strong>Initial event:</strong> The elevator leaves the lower landing from rest.</li>
          <li><strong>Final event:</strong> The elevator has risen 6.0 m and is moving upward at 1.50 m/s.</li>
        </ul>
        <p>This is motion with <strong>constant acceleration along a straight segment</strong>, so the kinematic equations apply. The elevator starts from rest, rises 6.0 m, and reaches an upward speed of 1.50 m/s.</p>
        <p>Choose the positive <span class="math-inline">\(y\)</span>-axis vertically upward, with unit vector <span class="math-inline">\(\hat{\mathbf{j}}\)</span>.</p>
        <p>The requested quantity is the elapsed time <span class="math-inline">\(\Delta t\)</span>, which is a positive scalar.</p>
        <h3>2. Organize the kinematic variables</h3>
        <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic variables for Problem 5</caption>
          <thead>
            <tr>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((6.0\,\mathrm{m})\hat{\mathbf{j}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Distance explicitly given; the vector direction follows from the chosen axis and motion.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_i\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((0\,\mathrm{m/s})\hat{\mathbf{j}}=\vec{0}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Implicit: the elevator leaves from rest.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_f\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((1.50\,\mathrm{m/s})\hat{\mathbf{j}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Speed explicitly given; the vector direction follows from the stated motion and chosen axis.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not given</td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Constant; numerical value not given or needed.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><strong>?</strong></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be solved for.</td>
            </tr>
          </tbody>
        </table>
        <h3>3. Select a kinematic equation</h3>
        <p>We know the displacement and both endpoint velocities. The average-velocity equation contains the unknown time and does not require acceleration:</p>
        <div class="math-display">\[
        \Delta\vec{r}=\frac{\vec{v}_i+\vec{v}_f}{2}\Delta t.
        \]</div>
        <h3>4. Solve algebraically for the unknown</h3>
        <p>Equate the <span class="math-inline">\(y\)</span>-components, then isolate <span class="math-inline">\(\Delta t\)</span>. This divides scalar components, not vectors:</p>
        <div class="math-display">\[
        \begin{aligned}
        \Delta\vec{r}&amp;=\frac{\vec{v}_i+\vec{v}_f}{2}\Delta t\\[3pt]
        \Delta y&amp;=\frac{v_{iy}+v_{fy}}{2}\Delta t\\[3pt]
        2\Delta y&amp;=(v_{iy}+v_{fy})\Delta t\\[3pt]
        \Delta t&amp;=\frac{2\Delta y}{v_{iy}+v_{fy}}.
        \end{aligned}
        \]</div>
        <h3>5. Substitute values with units and calculate</h3>
        <div class="math-display">\[
        \begin{aligned}
        \Delta t&amp;=\frac{2(6.0\,\mathrm{m})}{0\,\mathrm{m/s}+1.50\,\mathrm{m/s}}\\[3pt]
        &amp;=8.0\,\mathrm{s}.
        \end{aligned}
        \]</div>
        <p>The elapsed time is a scalar and has no unit vector.</p>
        <div class="math-display">\[
        \Delta t=\boxed{8.0\,\mathrm{s}}
        \]</div>
        <p><strong>Rounding:</strong> Two significant figures.</p>
        </div>
      on_correct: Good job!
      on_incorrect: Try again!
- numerical:
    id: q6
    title: 'Problem 6: Backing a fragile load into position'
    points: 1
    text: |
      <p>A warehouse operator is backing a forklift carrying a crated laboratory instrument along a straight, level aisle. The forklift is moving backward at 1.5 m/s when the operator begins braking. To avoid jarring the load, the operator reduces its speed at a constant rate and brings it to rest after it travels another 4.0 m backward. What is the magnitude of the forklift's acceleration while it is braking? Report your answer in <span class="math-inline">\(\mathrm{m/s^2}\)</span> to <strong>two significant figures</strong>.</p>
      </div>
    answer:
      value: 0.28
      margin_type: percent
      tolerance: 5
    feedback:
      general: |
        <h3>1. Identify the motion segment, physics, and requested quantity</h3>
        <ul>
          <li><strong>Initial event:</strong> The operator begins braking while the forklift is backing at 1.5 m/s.</li>
          <li><strong>Final event:</strong> The forklift first comes to rest after traveling another 4.0 m backward.</li>
        </ul>
        <p>This is motion with <strong>constant acceleration along a straight segment</strong>, so the kinematic equations apply. The forklift enters the braking segment at 1.5 m/s, moves 4.0 m backward, and stops.</p>
        <p>Choose the positive <span class="math-inline">\(x\)</span>-axis along the forklift's backward travel down the aisle, with unit vector <span class="math-inline">\(\hat{\mathbf{i}}\)</span>.</p>
        <p>The requested quantity is the magnitude of the acceleration vector, <span class="math-inline">\(|\vec{a}|\)</span>. We will determine the vector and then take its magnitude.</p>
        <h3>2. Organize the kinematic variables</h3>
        <table style="border-collapse: collapse; width: 100%;">
          <caption>Kinematic variables for Problem 6</caption>
          <thead>
            <tr>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Kinematic variable</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Symbol</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Value</th>
              <th scope="col" style="border: 1px solid #666; padding: 0.4em; text-align: left;">Given or unknown?</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Displacement</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta\vec{r}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((4.0\,\mathrm{m})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Distance explicitly given; the vector direction follows from the chosen axis and motion.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Initial instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_i\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((1.5\,\mathrm{m/s})\hat{\mathbf{i}}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Speed explicitly given; the vector direction follows from the stated motion and chosen axis.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Final instantaneous velocity</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{v}_f\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\((0\,\mathrm{m/s})\hat{\mathbf{i}}=\vec{0}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Implicit: the forklift comes to rest.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Acceleration</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\vec{a}\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><strong>?</strong></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">To be solved for. The question requests its magnitude.</td>
            </tr>
            <tr>
              <th scope="row" style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Time interval</th>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;"><span class="math-inline">\(\Delta t\)</span></td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not given</td>
              <td style="border: 1px solid #666; padding: 0.4em; text-align: left; vertical-align: top;">Not required for this calculation.</td>
            </tr>
          </tbody>
        </table>
        <h3>3. Select a kinematic equation</h3>
        <p>We know the displacement and both endpoint velocities, but not the time. Use the time-independent kinematic equation for the signed <span class="math-inline">\(x\)</span>-components. Here <span class="math-inline">\(\vec{v}_i=v_{ix}\hat{\mathbf{i}}\)</span>, <span class="math-inline">\(\vec{v}_f=v_{fx}\hat{\mathbf{i}}\)</span>, and <span class="math-inline">\(\Delta\vec{r}=\Delta x\hat{\mathbf{i}}\)</span>:</p>
        <div class="math-display">\[
        v_{fx}^{\,2}=v_{ix}^{\,2}+2a_x\Delta x.
        \]</div>
        <h3>4. Solve algebraically for the unknown</h3>
        <p>Subtract <span class="math-inline">\(v_{ix}^{\,2}\)</span>, divide by <span class="math-inline">\(2\Delta x\)</span>, and reconstruct the acceleration vector:</p>
        <div class="math-display">\[
        \begin{aligned}
        v_{fx}^{\,2}&amp;=v_{ix}^{\,2}+2a_x\Delta x\\[3pt]
        v_{fx}^{\,2}-v_{ix}^{\,2}&amp;=2a_x\Delta x\\[3pt]
        a_x&amp;=\frac{v_{fx}^{\,2}-v_{ix}^{\,2}}{2\Delta x}\\[3pt]
        \vec{a}&amp;=\left(\frac{v_{fx}^{\,2}-v_{ix}^{\,2}}{2\Delta x}\right)\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <h3>5. Substitute values with units and calculate</h3>
        <div class="math-display">\[
        \begin{aligned}
        a_x&amp;=\frac{(0\,\mathrm{m/s})^2-(1.5\,\mathrm{m/s})^2}{2(4.0\,\mathrm{m})}\\[3pt]
        &amp;=-0.28125\,\mathrm{m/s^2}\\[3pt]
        \vec{a}&amp;=(-0.28125\,\mathrm{m/s^2})\hat{\mathbf{i}}.
        \end{aligned}
        \]</div>
        <p>Here the positive axis points backward along the forklift's travel. The negative acceleration therefore points forward, opposite its backward motion.</p>
        <div class="math-display">\[
        |\vec{a}|=\boxed{0.28\,\mathrm{m/s^2}}
        \]</div>
        <p><strong>Rounding:</strong> Two significant figures.</p>
        </div>
      on_correct: Good job!
      on_incorrect: Try again!
- numerical:
    id: q7
    title: 'Problem 7: Coasting up a skateboard ramp'
    points: 1
    text: |
      <p>A skateboarder rolls onto the bottom of a straight uphill ramp at a skatepark and continues upward without pushing. The ramp has a uniform slope, and the skateboarder's speed decreases at a constant rate. Starting from the moment the skateboarder enters the ramp, the skateboard travels 3.00 m along the incline and reaches a momentary stop 2.0 s later. What is the magnitude of the skateboarder's acceleration during this uphill climb? Report your answer in <span class="math-inline">\(\mathrm{m/s^2}\)</span> to <strong>two significant figures</strong>.</p>
      </div>
