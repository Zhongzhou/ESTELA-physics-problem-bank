bank_info:
    title: Torque Balance On a Rod
    bank_id: PHY1-RM-TBORMC-11102026 #Subject-Unit-Abbreviation_of_title_or_any_string-date
    description: |-
      Multiple-choice conversion of the numerical bank PHY1-RM-TBOR-11112025. Torque balance on a uniform thin rod, with one force at an angle and one hanging block. The locations of the force, the block, and the pivot change between problems.
    date created: 11-10-2026 # Today's date 
    status: draft # Only use 'draft', 'ready', 'deployed', and 'deprecated' for this field.
    learning objectives:
    generation prompts: # The following are the prompts that generated the questions in the problem bank.
        - prompt 1: |
            This multiple-choice bank was converted from the numerical bank PHY1-RM-TBOR-11112025. Each problem keeps its scenario, figure, and the quantity it asks for. The numerical answer is replaced by one correct choice and six distractors.

            The choice pattern is the q1 set in q1-mc-draft.md. A distractor ignores the 60 degree angle, swaps sine and cosine, gives the two weights the wrong relative torque direction, leaves one weight out, uses the full rod length as the rod's lever arm, or adds the two weights. choice-set-adaptation.md rewrites the roles that name the unknown, and it substitutes a role when two choices would round to the same integer. A few given weights were changed so that no distractor is only 1 N from the correct answer. build_mc_bank.py applies that plan to PHY1-RM-TBOR-11112025.yaml.
    updates: 
        - update 1: (11/10/2026) Converted PHY1-RM-TBOR-11112025 into this multiple-choice draft.
    associated data:
        - source bank: "../PHY1-RM-TBOR-11112025/PHY1-RM-TBOR-11112025.yaml"
        - choice pattern: "./q1-mc-draft.md"
        - adaptation plan: "./choice-set-adaptation.md"
        - build script: "./build_mc_bank.py"
    generation details: # Details of the creation process
            model: Cursor Grok # The model used to generate the questions
            version: 4.7 # The version of the model used
            last updated: 11-10-2026 # The date of the last update of the generation prompts.
    authors:
        - Zhongzhou Chen 
        - Spencer Moore

questions:
- multiple_choice:
    id: q1
    title: Static Equilibrium of a Horizontal Rod – Force Determination
    points: 1
    text: |
        A uniform thin rod of length **L = 1.0 m** is held in a **horizontal** position and can rotate freely about a **pivot located at the right end** of the rod. The rod is in **static equilibrium**. The rod’s weight is **32 N**. A block of weight **4 N** is suspended from the rod **at <latex>\tfrac{1}{8}L</latex> from the right end**.

        An external force **F** is applied on the rod **at <latex>\tfrac{3}{4}L</latex> from the right end**. The force points **upward at an angle of <latex>60^\circ</latex>** with respect to the vertical, as shown in the image. All distances are measured from the **right end** of the rod.

        Determine the **magnitude of the force <latex>F</latex>** (in newtons) required to maintain equilibrium. **Round your answer to the nearest integer.**
    figure: q1_p0_b_18_f34.png
    answers:
        - answer:
            text: 44 N
            correct: true
        - answer:
            text: 22 N
            correct: false
        - answer:
            text: 25 N
            correct: false
        - answer:
            text: 41 N
            correct: false
        - answer:
            text: 1 N
            correct: false
        - answer:
            text: 87 N
            correct: false
        - answer:
            text: 36 N
            correct: false
    feedback:
        general: |
          About the pivot, with the perpendicular component <latex>F\cos 60^\circ = F/2</latex> and the rod's weight at its center, torque balance gives the force <b><latex>44\text{ N}</latex></b>.
        on_correct: Good job!
        on_incorrect: Try again!

