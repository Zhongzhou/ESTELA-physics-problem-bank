    <h4><span style="text-decoration: underline;">Option 1: Use the vector equation for electrostatic force (recommended).</span></h4>
    <p><strong>First, calculate the contribution from each source charge acting on \(q_1\).</strong></p>
    <p>For numerical evaluation, use \(k=8.99\times10^9\ \mathrm{N\,m^2/C^2}\) and convert all quantities to SI units: \(q_1=2.50\times10^{-7}\ \mathrm{C},\quad q_2=-4.00\times10^{-7}\ \mathrm{C},\quad q_3=6.50\times10^{-7}\ \mathrm{C},\quad d=6.0\times10^{-4}\ \mathrm{m}\).</p>
    <p><strong>First, calculate the force of \(q_2\) on \(q_1\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_2\) to target \(q_1\) is \(\vec{r}_{21}=3d\hat{j}\), so \(r_{21}^2=9d^2\) and \(\hat{r}_{21}=\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_2\text{ on }q_1}&amp;=k\frac{q_2q_1}{r_{21}^2}\hat{r}_{21}\\
    &amp;=k\frac{(-400\ \mathrm{nC})(+250\ \mathrm{nC})}{9d^2}\left(\hat{j}\right)\\
    &amp;=\left(-2.77\times10^{2}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_2q_1\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{21}\).</p>
    <p><strong>Similarly, calculate the force of \(q_3\) on \(q_1\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_3\) to target \(q_1\) is \(\vec{r}_{31}=3d\hat{i} + d\hat{j}\), so \(r_{31}^2=10d^2\) and \(\hat{r}_{31}=\frac{3}{\sqrt{10}}\hat{i} + \frac{1}{\sqrt{10}}\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_3\text{ on }q_1}&amp;=k\frac{q_3q_1}{r_{31}^2}\hat{r}_{31}\\
    &amp;=k\frac{(+650\ \mathrm{nC})(+250\ \mathrm{nC})}{10d^2}\left(\frac{3}{\sqrt{10}}\hat{i} + \frac{1}{\sqrt{10}}\hat{j}\right)\\
    &amp;=\left(3.85\times10^{2}\hat{i} + 1.28\times10^{2}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_3q_1\) is positive, the charges repel; therefore, the force is along \(\hat{r}_{31}\).</p>
    <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \sum\vec{F}_{\text{on }q_1}&amp;=\vec{F}_{q_2\text{ on }q_1}+\vec{F}_{q_3\text{ on }q_1}\\
    &amp;=\left(-2.77\times10^{2}\hat{j}\right)\ \mathrm{N}+\left(3.85\times10^{2}\hat{i} + 1.28\times10^{2}\hat{j}\right)\ \mathrm{N}\\
    &amp;=\left(3.85\times10^{2}\hat{i} - 1.49\times10^{2}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \left|\sum\vec{F}_{\text{on }q_1}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
    &amp;=\sqrt{\left(3.85\times10^{2}\right)^2+\left(-1.49\times10^{2}\right)^2}\\
    &amp;=\boxed{4.1\times10^{2}\ \mathrm{N}}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=338.8^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
    <hr />
    <h4><span style="text-decoration: underline;">Option 2: Find each magnitude and direction separately.</span></h4>
    <p>Calculate the magnitude of each source-charge force with Coulomb's law, determine its direction from attraction or repulsion, and then add the forces as vectors.</p>
    <p>The force of \(q_2\) on \(q_1\) has magnitude \(F_{q_2\text{ on }q_1}=k\frac{\left|q_2q_1\right|}{9d^2}=2.77\times10^{2}\ \mathrm{N}\). Its direction is \(-\hat{j}\) because of attraction.</p>
