    <p style="padding-left: 40px;">Because \(q_3q_1\) is positive, the charges repel; therefore, the force is along \(\hat{r}_{31}\).</p>
    <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \sum\vec{F}_{\text{on }q_1}&amp;=\vec{F}_{q_2\text{ on }q_1}+\vec{F}_{q_3\text{ on }q_1}\\
    &amp;=\left(1.65\times10^{2}\hat{j}\right)\ \mathrm{N}+\left(2.05\times10^{1}\hat{i} + 6.82\times10^{0}\hat{j}\right)\ \mathrm{N}\\
    &amp;=\left(2.05\times10^{1}\hat{i} + 1.72\times10^{2}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \left|\sum\vec{F}_{\text{on }q_1}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
    &amp;=\sqrt{\left(2.05\times10^{1}\right)^2+\left(1.72\times10^{2}\right)^2}\\
    &amp;=\boxed{1.7\times10^{2}\ \mathrm{N}}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=83.2^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
    <hr />
    <h4><span style="text-decoration: underline;">Option 2: Find each magnitude and direction separately.</span></h4>
    <p>Calculate the magnitude of each source-charge force with Coulomb's law, determine its direction from attraction or repulsion, and then add the forces as vectors.</p>
    <p>The force of \(q_2\) on \(q_1\) has magnitude \(F_{q_2\text{ on }q_1}=k\frac{\left|q_2q_1\right|}{4d^2}=1.65\times10^{2}\ \mathrm{N}\). Its direction is \(\hat{j}\) because of attraction.</p>
    <p>The force of \(q_3\) on \(q_1\) has magnitude \(F_{q_3\text{ on }q_1}=k\frac{\left|q_3q_1\right|}{10d^2}=2.16\times10^{1}\ \mathrm{N}\). Its direction is \(\frac{3}{\sqrt{10}}\hat{i} + \frac{1}{\sqrt{10}}\hat{j}\) because of repulsion.</p>
    <p>Resolve these forces into components and add the x-components and y-components separately. This gives \(\sum\vec{F}_{\text{on }q_1}=\left(2.05\times10^{1}\hat{i} + 1.72\times10^{2}\hat{j}\right)\ \mathrm{N}\), with magnitude \(\boxed{1.7\times10^{2}\ \mathrm{N}}\) and direction \(83.2^\circ\) counterclockwise from the \(+x\)-axis.</p>
