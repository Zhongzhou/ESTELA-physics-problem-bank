    <h4><span style="text-decoration: underline;">Option 1: Use the vector equation for electrostatic force (recommended).</span></h4>
    <p><strong>First, calculate the contribution from each source charge acting on \(q_2\).</strong></p>
    <p>For numerical evaluation, use \(k=8.99\times10^9\ \mathrm{N\,m^2/C^2}\) and convert all quantities to SI units: \(q_1=6.00\times10^{-6}\ \mathrm{C},\quad q_2=-2.00\times10^{-6}\ \mathrm{C},\quad q_3=-4.50\times10^{-6}\ \mathrm{C},\quad d=2.5\times10^{-2}\ \mathrm{m}\).</p>
    <p><strong>First, calculate the force of \(q_1\) on \(q_2\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_1\) to target \(q_2\) is \(\vec{r}_{12}=-d\hat{i} - 3d\hat{j}\), so \(r_{12}^2=10d^2\) and \(\hat{r}_{12}=-\frac{1}{\sqrt{10}}\hat{i} - \frac{3}{\sqrt{10}}\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_1\text{ on }q_2}&amp;=k\frac{q_1q_2}{r_{12}^2}\hat{r}_{12}\\
    &amp;=k\frac{(+6.0\ \mu\mathrm{C})(-2.0\ \mu\mathrm{C})}{10d^2}\left(-\frac{1}{\sqrt{10}}\hat{i} - \frac{3}{\sqrt{10}}\hat{j}\right)\\
    &amp;=\left(5.46\times10^{0}\hat{i} + 1.64\times10^{1}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_1q_2\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{12}\).</p>
    <p><strong>Similarly, calculate the force of \(q_3\) on \(q_2\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_3\) to target \(q_2\) is \(\vec{r}_{32}=2d\hat{i}\), so \(r_{32}^2=4d^2\) and \(\hat{r}_{32}=\hat{i}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_3\text{ on }q_2}&amp;=k\frac{q_3q_2}{r_{32}^2}\hat{r}_{32}\\
    &amp;=k\frac{(-4.5\ \mu\mathrm{C})(-2.0\ \mu\mathrm{C})}{4d^2}\left(\hat{i}\right)\\
    &amp;=\left(3.24\times10^{1}\hat{i}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_3q_2\) is positive, the charges repel; therefore, the force is along \(\hat{r}_{32}\).</p>
    <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \sum\vec{F}_{\text{on }q_2}&amp;=\vec{F}_{q_1\text{ on }q_2}+\vec{F}_{q_3\text{ on }q_2}\\
    &amp;=\left(5.46\times10^{0}\hat{i} + 1.64\times10^{1}\hat{j}\right)\ \mathrm{N}+\left(3.24\times10^{1}\hat{i}\right)\ \mathrm{N}\\
    &amp;=\left(3.78\times10^{1}\hat{i} + 1.64\times10^{1}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \left|\sum\vec{F}_{\text{on }q_2}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
    &amp;=\sqrt{\left(3.78\times10^{1}\right)^2+\left(1.64\times10^{1}\right)^2}\\
    &amp;=\boxed{4.1\times10^{1}\ \mathrm{N}}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=23.4^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
    <hr />
