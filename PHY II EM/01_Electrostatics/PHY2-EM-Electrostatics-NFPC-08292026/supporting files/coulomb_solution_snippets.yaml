- id: q1
  html: |
    <h4><span style="text-decoration: underline;">Option 1: Use the vector equation for electrostatic force (recommended).</span></h4>
    <p><strong>First, calculate the contribution from each source charge acting on \(q_2\).</strong></p>
    <p>For numerical evaluation, use \(k=8.99\times10^9\ \mathrm{N\,m^2/C^2}\), \(e=1.602\times10^{-19}\ \mathrm{C}\), and \(d=2.0\times10^{-8}\ \mathrm{m}\).</p>
    <p><strong>First, calculate the force of \(q_1\) on \(q_2\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_1\) to target \(q_2\) is \(\vec{r}_{12}=2d\hat{i}\), so \(r_{12}^2=4d^2\) and \(\hat{r}_{12}=\hat{i}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_1\text{ on }q_2}&amp;=k\frac{q_1q_2}{r_{12}^2}\hat{r}_{12}\\
    &amp;=k\frac{(+2e)(-3e)}{4d^2}\left(\hat{i}\right)\\
    &amp;=\left(-8.65\times10^{-13}\hat{i}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_1q_2\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{12}\).</p>
    <p><strong>Similarly, calculate the force of \(q_3\) on \(q_2\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_3\) to target \(q_2\) is \(\vec{r}_{32}=-d\hat{i} + 2d\hat{j}\), so \(r_{32}^2=5d^2\) and \(\hat{r}_{32}=-\frac{1}{\sqrt{5}}\hat{i} + \frac{2}{\sqrt{5}}\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_3\text{ on }q_2}&amp;=k\frac{q_3q_2}{r_{32}^2}\hat{r}_{32}\\
    &amp;=k\frac{(-5e)(-3e)}{5d^2}\left(-\frac{1}{\sqrt{5}}\hat{i} + \frac{2}{\sqrt{5}}\hat{j}\right)\\
    &amp;=\left(-7.74\times10^{-13}\hat{i} + 1.55\times10^{-12}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_3q_2\) is positive, the charges repel; therefore, the force is along \(\hat{r}_{32}\).</p>
    <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \sum\vec{F}_{\text{on }q_2}&amp;=\vec{F}_{q_1\text{ on }q_2}+\vec{F}_{q_3\text{ on }q_2}\\
    &amp;=\left(-8.65\times10^{-13}\hat{i}\right)\ \mathrm{N}+\left(-7.74\times10^{-13}\hat{i} + 1.55\times10^{-12}\hat{j}\right)\ \mathrm{N}\\
    &amp;=\left(-1.64\times10^{-12}\hat{i} + 1.55\times10^{-12}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \left|\sum\vec{F}_{\text{on }q_2}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
    &amp;=\sqrt{\left(-1.64\times10^{-12}\right)^2+\left(1.55\times10^{-12}\right)^2}\\
    &amp;=\boxed{2.3\times10^{-12}\ \mathrm{N}}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=136.6^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
    <hr />
    <h4><span style="text-decoration: underline;">Option 2: Find each magnitude and direction separately.</span></h4>
    <p>Calculate the magnitude of each source-charge force with Coulomb's law, determine its direction from attraction or repulsion, and then add the forces as vectors.</p>
    <p>The force of \(q_1\) on \(q_2\) has magnitude \(F_{q_1\text{ on }q_2}=k\frac{\left|q_1q_2\right|}{4d^2}=8.65\times10^{-13}\ \mathrm{N}\). Its direction is \(-\hat{i}\) because of attraction.</p>
    <p>The force of \(q_3\) on \(q_2\) has magnitude \(F_{q_3\text{ on }q_2}=k\frac{\left|q_3q_2\right|}{5d^2}=1.73\times10^{-12}\ \mathrm{N}\). Its direction is \(-\frac{1}{\sqrt{5}}\hat{i} + \frac{2}{\sqrt{5}}\hat{j}\) because of repulsion.</p>
    <p>Resolve these forces into components and add the x-components and y-components separately. This gives \(\sum\vec{F}_{\text{on }q_2}=\left(-1.64\times10^{-12}\hat{i} + 1.55\times10^{-12}\hat{j}\right)\ \mathrm{N}\), with magnitude \(\boxed{2.3\times10^{-12}\ \mathrm{N}}\) and direction \(136.6^\circ\) counterclockwise from the \(+x\)-axis.</p>
    <hr />
- id: q2
  html: |
    <h4><span style="text-decoration: underline;">Option 1: Use the vector equation for electrostatic force (recommended).</span></h4>
    <p><strong>First, calculate the contribution from each source charge acting on \(q_1\).</strong></p>
    <p>For numerical evaluation, use \(k=8.99\times10^9\ \mathrm{N\,m^2/C^2}\), \(e=1.602\times10^{-19}\ \mathrm{C}\), and \(d=4.5\times10^{-8}\ \mathrm{m}\).</p>
    <p><strong>First, calculate the force of \(q_2\) on \(q_1\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_2\) to target \(q_1\) is \(\vec{r}_{21}=-3d\hat{i} + d\hat{j}\), so \(r_{21}^2=10d^2\) and \(\hat{r}_{21}=-\frac{3}{\sqrt{10}}\hat{i} + \frac{1}{\sqrt{10}}\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_2\text{ on }q_1}&amp;=k\frac{q_2q_1}{r_{21}^2}\hat{r}_{21}\\
    &amp;=k\frac{(+7e)(-4e)}{10d^2}\left(-\frac{3}{\sqrt{10}}\hat{i} + \frac{1}{\sqrt{10}}\hat{j}\right)\\
    &amp;=\left(3.03\times10^{-13}\hat{i} - 1.01\times10^{-13}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_2q_1\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{21}\).</p>
    <p><strong>Similarly, calculate the force of \(q_3\) on \(q_1\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_3\) to target \(q_1\) is \(\vec{r}_{31}=-2d\hat{j}\), so \(r_{31}^2=4d^2\) and \(\hat{r}_{31}=-\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_3\text{ on }q_1}&amp;=k\frac{q_3q_1}{r_{31}^2}\hat{r}_{31}\\
    &amp;=k\frac{(+3e)(-4e)}{4d^2}\left(-\hat{j}\right)\\
    &amp;=\left(3.42\times10^{-13}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_3q_1\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{31}\).</p>
    <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \sum\vec{F}_{\text{on }q_1}&amp;=\vec{F}_{q_2\text{ on }q_1}+\vec{F}_{q_3\text{ on }q_1}\\
    &amp;=\left(3.03\times10^{-13}\hat{i} - 1.01\times10^{-13}\hat{j}\right)\ \mathrm{N}+\left(3.42\times10^{-13}\hat{j}\right)\ \mathrm{N}\\
    &amp;=\left(3.03\times10^{-13}\hat{i} + 2.41\times10^{-13}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \left|\sum\vec{F}_{\text{on }q_1}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
    &amp;=\sqrt{\left(3.03\times10^{-13}\right)^2+\left(2.41\times10^{-13}\right)^2}\\
    &amp;=\boxed{3.9\times10^{-13}\ \mathrm{N}}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=38.5^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
    <hr />
    <h4><span style="text-decoration: underline;">Option 2: Find each magnitude and direction separately.</span></h4>
    <p>Calculate the magnitude of each source-charge force with Coulomb's law, determine its direction from attraction or repulsion, and then add the forces as vectors.</p>
    <p>The force of \(q_2\) on \(q_1\) has magnitude \(F_{q_2\text{ on }q_1}=k\frac{\left|q_2q_1\right|}{10d^2}=3.19\times10^{-13}\ \mathrm{N}\). Its direction is \(\frac{3}{\sqrt{10}}\hat{i} - \frac{1}{\sqrt{10}}\hat{j}\) because of attraction.</p>
    <p>The force of \(q_3\) on \(q_1\) has magnitude \(F_{q_3\text{ on }q_1}=k\frac{\left|q_3q_1\right|}{4d^2}=3.42\times10^{-13}\ \mathrm{N}\). Its direction is \(\hat{j}\) because of attraction.</p>
    <p>Resolve these forces into components and add the x-components and y-components separately. This gives \(\sum\vec{F}_{\text{on }q_1}=\left(3.03\times10^{-13}\hat{i} + 2.41\times10^{-13}\hat{j}\right)\ \mathrm{N}\), with magnitude \(\boxed{3.9\times10^{-13}\ \mathrm{N}}\) and direction \(38.5^\circ\) counterclockwise from the \(+x\)-axis.</p>
    <hr />
- id: q3
  html: |
    <h4><span style="text-decoration: underline;">Option 1: Use the vector equation for electrostatic force (recommended).</span></h4>
    <p><strong>First, calculate the contribution from each source charge acting on \(q_3\).</strong></p>
    <p>For numerical evaluation, use \(k=8.99\times10^9\ \mathrm{N\,m^2/C^2}\), \(e=1.602\times10^{-19}\ \mathrm{C}\), and \(d=2.0\times10^{-6}\ \mathrm{m}\).</p>
    <p><strong>First, calculate the force of \(q_1\) on \(q_3\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_1\) to target \(q_3\) is \(\vec{r}_{13}=3d\hat{i} - 2d\hat{j}\), so \(r_{13}^2=13d^2\) and \(\hat{r}_{13}=\frac{3}{\sqrt{13}}\hat{i} - \frac{2}{\sqrt{13}}\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_1\text{ on }q_3}&amp;=k\frac{q_1q_3}{r_{13}^2}\hat{r}_{13}\\
    &amp;=k\frac{(+6e)(+5e)}{13d^2}\left(\frac{3}{\sqrt{13}}\hat{i} - \frac{2}{\sqrt{13}}\hat{j}\right)\\
    &amp;=\left(1.11\times10^{-16}\hat{i} - 7.38\times10^{-17}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_1q_3\) is positive, the charges repel; therefore, the force is along \(\hat{r}_{13}\).</p>
    <p><strong>Similarly, calculate the force of \(q_2\) on \(q_3\):</strong></p>
    <p style="padding-left: 40px;">The displacement from source \(q_2\) to target \(q_3\) is \(\vec{r}_{23}=-3d\hat{j}\), so \(r_{23}^2=9d^2\) and \(\hat{r}_{23}=-\hat{j}\).</p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \vec{F}_{q_2\text{ on }q_3}&amp;=k\frac{q_2q_3}{r_{23}^2}\hat{r}_{23}\\
    &amp;=k\frac{(-2e)(+5e)}{9d^2}\left(-\hat{j}\right)\\
    &amp;=\left(6.41\times10^{-17}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Because \(q_2q_3\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{23}\).</p>
    <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \sum\vec{F}_{\text{on }q_3}&amp;=\vec{F}_{q_1\text{ on }q_3}+\vec{F}_{q_2\text{ on }q_3}\\
    &amp;=\left(1.11\times10^{-16}\hat{i} - 7.38\times10^{-17}\hat{j}\right)\ \mathrm{N}+\left(6.41\times10^{-17}\hat{j}\right)\ \mathrm{N}\\
    &amp;=\left(1.11\times10^{-16}\hat{i} - 9.75\times10^{-18}\hat{j}\right)\ \mathrm{N}
    \end{aligned}\)</p>
    <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
    <p style="padding-left: 40px;">\(\begin{aligned}
    \left|\sum\vec{F}_{\text{on }q_3}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
    &amp;=\sqrt{\left(1.11\times10^{-16}\right)^2+\left(-9.75\times10^{-18}\right)^2}\\
    &amp;=\boxed{1.1\times10^{-16}\ \mathrm{N}}
    \end{aligned}\)</p>
    <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=355.0^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
    <hr />
    <h4><span style="text-decoration: underline;">Option 2: Find each magnitude and direction separately.</span></h4>
    <p>Calculate the magnitude of each source-charge force with Coulomb's law, determine its direction from attraction or repulsion, and then add the forces as vectors.</p>
    <p>The force of \(q_1\) on \(q_3\) has magnitude \(F_{q_1\text{ on }q_3}=k\frac{\left|q_1q_3\right|}{13d^2}=1.33\times10^{-16}\ \mathrm{N}\). Its direction is \(\frac{3}{\sqrt{13}}\hat{i} - \frac{2}{\sqrt{13}}\hat{j}\) because of repulsion.</p>
    <p>The force of \(q_2\) on \(q_3\) has magnitude \(F_{q_2\text{ on }q_3}=k\frac{\left|q_2q_3\right|}{9d^2}=6.41\times10^{-17}\ \mathrm{N}\). Its direction is \(\hat{j}\) because of attraction.</p>
    <p>Resolve these forces into components and add the x-components and y-components separately. This gives \(\sum\vec{F}_{\text{on }q_3}=\left(1.11\times10^{-16}\hat{i} - 9.75\times10^{-18}\hat{j}\right)\ \mathrm{N}\), with magnitude \(\boxed{1.1\times10^{-16}\ \mathrm{N}}\) and direction \(355.0^\circ\) counterclockwise from the \(+x\)-axis.</p>
    <hr />
