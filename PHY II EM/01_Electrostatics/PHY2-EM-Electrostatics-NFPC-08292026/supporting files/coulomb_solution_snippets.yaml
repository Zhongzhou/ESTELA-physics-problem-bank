    <p>The force of \(q_3\) on \(q_2\) has magnitude \(F_{q_3\text{ on }q_2}=k\frac{\left|q_3q_2\right|}{4d^2}=3.24\times10^{1}\ \mathrm{N}\). Its direction is \(\hat{i}\) because of repulsion.</p>
    <p>Resolve these forces into components and add the x-components and y-components separately. This gives \(\sum\vec{F}_{\text{on }q_2}=\left(3.78\times10^{1}\hat{i} + 1.64\times10^{1}\hat{j}\right)\ \mathrm{N}\), with magnitude \(\boxed{4.1\times10^{1}\ \mathrm{N}}\) and direction \(23.4^\circ\) counterclockwise from the \(+x\)-axis.</p>
