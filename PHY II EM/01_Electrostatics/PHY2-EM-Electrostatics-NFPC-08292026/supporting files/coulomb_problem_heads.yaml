problem_heads:
  - id: q1
    html: |
      <p>Three charged objects are fixed in the following configuration, where \(e\) is the elementary charge and \(d=20\ \mathrm{nm}\):</p>
      <ul>
        <li>\(q_1=+2e\) is located at \(\vec{r}_1=(-2d,d)\),</li>
        <li>\(q_2=-3e\) is located at \(\vec{r}_2=(0,d)\), and</li>
        <li>\(q_3=-5e\) is located at \(\vec{r}_3=(d,-d)\).</li>
      </ul>
      <p>Calculate the magnitude of the net force acting on \(q_2\) due to the combined effect of \(q_1\) and \(q_3\).&nbsp;</p>
      <p>Provide your answer in SI units, in scientific notation with two significant digits.</p>

  - id: q2
    html: |
      <p>Three charged objects are fixed in the following configuration, where \(e\) is the elementary charge and \(d=45\ \mathrm{nm}\):</p>
      <ul>
        <li>\(q_1=-4e\) is located at \(\vec{r}_1=(-d,0)\),</li>
        <li>\(q_2=+7e\) is located at \(\vec{r}_2=(2d,-d)\), and</li>
        <li>\(q_3=+3e\) is located at \(\vec{r}_3=(-d,2d)\).</li>
      </ul>
      <p>Calculate the magnitude of the net force acting on \(q_1\) due to the combined effect of \(q_2\) and \(q_3\).&nbsp;</p>
      <p>Provide your answer in SI units, in scientific notation with two significant digits.</p>

