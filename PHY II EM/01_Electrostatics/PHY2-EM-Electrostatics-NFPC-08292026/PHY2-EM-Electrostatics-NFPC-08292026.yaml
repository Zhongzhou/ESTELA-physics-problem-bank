      - Figures/coulomb_problem_11_force_q3_on_q2.png
- numerical:
    id: q12
    title: PHY2-EM-Electrostatics-NFPC problem 12
    points: 1
    text: |
      <p>Three charged objects are fixed in the following configuration, where \(d=4.0\ \mathrm{cm}\):</p>
      <ul>
        <li>\(q_1=-7.5\ \mu\mathrm{C}\) is located at \(\vec{r}_1=(-d,2d)\),</li>
        <li>\(q_2=+3.5\ \mu\mathrm{C}\) is located at \(\vec{r}_2=(0,-2d)\), and</li>
        <li>\(q_3=+5.0\ \mu\mathrm{C}\) is located at \(\vec{r}_3=(2d,2d)\).</li>
      </ul>
      <p>Calculate the magnitude of the net force acting on \(q_3\) due to the combined effect of \(q_1\) and \(q_2\).&nbsp;</p>
      <p>Provide your answer in SI units, in scientific notation with two significant digits.</p>
    figure: Figures/coulomb_problem_12.png
    settings:
      scientific: true
    answer:
      range_start: 2.1*10^1
      range_end: 2.3*10^1
    feedback:
      general: |
        <h4><span style="text-decoration: underline;">Option 1: Use the vector equation for electrostatic force (recommended).</span></h4>
        <p><strong>First, calculate the contribution from each source charge acting on \(q_3\).</strong></p>
        <p>For numerical evaluation, use \(k=8.99\times10^9\ \mathrm{N\,m^2/C^2}\) and convert all quantities to SI units: \(q_1=-7.50\times10^{-6}\ \mathrm{C},\quad q_2=3.50\times10^{-6}\ \mathrm{C},\quad q_3=5.00\times10^{-6}\ \mathrm{C},\quad d=4.0\times10^{-2}\ \mathrm{m}\).</p>
        <p><strong>First, calculate the force of \(q_1\) on \(q_3\):</strong></p>
        <p style="padding-left: 40px;">The displacement from source \(q_1\) to target \(q_3\) is \(\vec{r}_{13}=3d\hat{i}\), so \(r_{13}^2=9d^2\) and \(\hat{r}_{13}=\hat{i}\).</p>
        <p style="padding-left: 40px;">\(\begin{aligned}
        \vec{F}_{q_1\text{ on }q_3}&amp;=k\frac{q_1q_3}{r_{13}^2}\hat{r}_{13}\\
        &amp;=k\frac{(-7.5\ \mu\mathrm{C})(+5.0\ \mu\mathrm{C})}{9d^2}\left(\hat{i}\right)\\
        &amp;=\left(-2.34\times10^{1}\hat{i}\right)\ \mathrm{N}
        \end{aligned}\)</p>
        <p style="padding-left: 40px;">Because \(q_1q_3\) is negative, the charges attract; therefore, the force is opposite \(\hat{r}_{13}\).</p>
        <p><strong>Similarly, calculate the force of \(q_2\) on \(q_3\):</strong></p>
        <p style="padding-left: 40px;">The displacement from source \(q_2\) to target \(q_3\) is \(\vec{r}_{23}=2d\hat{i} + 4d\hat{j}\), so \(r_{23}^2=20d^2\) and \(\hat{r}_{23}=\frac{2}{\sqrt{20}}\hat{i} + \frac{4}{\sqrt{20}}\hat{j}\).</p>
        <p style="padding-left: 40px;">\(\begin{aligned}
        \vec{F}_{q_2\text{ on }q_3}&amp;=k\frac{q_2q_3}{r_{23}^2}\hat{r}_{23}\\
        &amp;=k\frac{(+3.5\ \mu\mathrm{C})(+5.0\ \mu\mathrm{C})}{20d^2}\left(\frac{2}{\sqrt{20}}\hat{i} + \frac{4}{\sqrt{20}}\hat{j}\right)\\
        &amp;=\left(2.20\times10^{0}\hat{i} + 4.40\times10^{0}\hat{j}\right)\ \mathrm{N}
        \end{aligned}\)</p>
        <p style="padding-left: 40px;">Because \(q_2q_3\) is positive, the charges repel; therefore, the force is along \(\hat{r}_{23}\).</p>
        <p><strong>Now combine both contributions by adding the \(\hat{i}\) and \(\hat{j}\) components separately:</strong></p>
        <p style="padding-left: 40px;">\(\begin{aligned}
        \sum\vec{F}_{\text{on }q_3}&amp;=\vec{F}_{q_1\text{ on }q_3}+\vec{F}_{q_2\text{ on }q_3}\\
        &amp;=\left(-2.34\times10^{1}\hat{i}\right)\ \mathrm{N}+\left(2.20\times10^{0}\hat{i} + 4.40\times10^{0}\hat{j}\right)\ \mathrm{N}\\
        &amp;=\left(-2.12\times10^{1}\hat{i} + 4.40\times10^{0}\hat{j}\right)\ \mathrm{N}
        \end{aligned}\)</p>
        <p><strong>Find the magnitude and direction of the resulting vector:</strong></p>
        <p style="padding-left: 40px;">\(\begin{aligned}
        \left|\sum\vec{F}_{\text{on }q_3}\right|&amp;=\sqrt{F_x^2+F_y^2}\\
        &amp;=\sqrt{\left(-2.12\times10^{1}\right)^2+\left(4.40\times10^{0}\right)^2}\\
        &amp;=\boxed{2.2\times10^{1}\ \mathrm{N}}
        \end{aligned}\)</p>
        <p style="padding-left: 40px;">Using \(\operatorname{atan2}(F_y,F_x)\) to select the correct quadrant, \(\theta=168.3^\circ\), measured counterclockwise from the \(+x\)-axis.</p>
        <hr />
        <h4><span style="text-decoration: underline;">Option 2: Find each magnitude and direction separately.</span></h4>
        <p>Calculate the magnitude of each source-charge force with Coulomb's law, determine its direction from attraction or repulsion, and then add the forces as vectors.</p>
        <p>The force of \(q_1\) on \(q_3\) has magnitude \(F_{q_1\text{ on }q_3}=k\frac{\left|q_1q_3\right|}{9d^2}=2.34\times10^{1}\ \mathrm{N}\). Its direction is \(-\hat{i}\) because of attraction.</p>
        <p>The force of \(q_2\) on \(q_3\) has magnitude \(F_{q_2\text{ on }q_3}=k\frac{\left|q_2q_3\right|}{20d^2}=4.92\times10^{0}\ \mathrm{N}\). Its direction is \(\frac{2}{\sqrt{20}}\hat{i} + \frac{4}{\sqrt{20}}\hat{j}\) because of repulsion.</p>
        <p>Resolve these forces into components and add the x-components and y-components separately. This gives \(\sum\vec{F}_{\text{on }q_3}=\left(-2.12\times10^{1}\hat{i} + 4.40\times10^{0}\hat{j}\right)\ \mathrm{N}\), with magnitude \(\boxed{2.2\times10^{1}\ \mathrm{N}}\) and direction \(168.3^\circ\) counterclockwise from the \(+x\)-axis.</p>
        <hr />
