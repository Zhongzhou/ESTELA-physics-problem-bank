    feedback:
      general: |
        <section>
        <h3>Symbolic solution</h3>
        <p>Given: \(R_1=R_2=R_3=R_4=R_5=R\), where \(R\) is a positive resistance measured in ohms. Find \(R_{\mathrm{eq}}\) between the battery terminals. Ideal wires have zero resistance.</p>
        <p>Series resistors carry the same current and have equivalent resistance \(R_{\mathrm{s}}=\sum_i R_i\). Parallel resistors share a potential difference and satisfy \(\frac{1}{R_{\mathrm{p}}}=\sum_i\frac{1}{R_i}\).</p>
        <ol>
        <li><p><strong>Identify the bridge.</strong> The top arm is \(R_2\) followed by \(R_5\); the bottom arm is \(R_4\) followed by \(R_1\). Resistor \(R_3\) connects the two arm midpoints. This is a Wheatstone bridge.</p></li>
        <li><p><strong>Check the balance condition.</strong> The ratios in the two arms are equal. Therefore, their midpoints, called \(C\) and \(D\), have the same potential.</p><p>\[\frac{R_2}{R_5}=\frac{R_4}{R_1}=\frac{R}{R}=1.\]</p><p>\[\phi_C=\phi_D,\qquad \Delta V_3=\phi_C-\phi_D=0,\qquad I_3=\frac{\Delta V_3}{R_3}=0.\]</p></li>
        <li><p><strong>Reduce the two conducting arms.</strong> Because the center resistor carries zero current, each arm consists of two resistors carrying the same current in series. The arms are in parallel between the battery terminals.</p><p>\[R_{\mathrm{top}}=R_2+R_5=2R,\qquad R_{\mathrm{bottom}}=R_4+R_1=2R.\]</p></li>
        <li><p><strong>Combine the arms and check.</strong> Two equal resistances in parallel give half the resistance of either arm. The center resistor's zero-current condition follows from the equal resistor values.</p><p>\[\frac{1}{R_{\mathrm{eq}}}=\frac{1}{2R}+\frac{1}{2R}=\frac{1}{R},\qquad \boxed{R_{\mathrm{eq}}=R}.\]</p></li>
        <li><p><strong>Apply the assigned value and report the result.</strong> Substitute the resistance assigned to each resistor for \(R\) in the boxed expression. Keep the exact fraction until the final calculation, then report the equivalent resistance in ohms to <strong>three significant digits</strong>. The symbolic expression applies to every provided answer set.</p></li>
        </ol>
        </section>
      on_correct: |
        <p>Correct! Your equivalent resistance agrees with the circuit's connections and equal resistor values.</p>
      on_incorrect: |
        <p>Check whether the bridge is balanced. If the midpoints have equal potential, the center resistor carries zero current; then reduce the two conducting arms. Keep exact expressions until the final rounding.</p>
