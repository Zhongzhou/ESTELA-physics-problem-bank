      <p>In Circuit 2, all five resistors have the same resistance: \(R_1=R_2=R_3=R_4=R_5=R\).</p>

      <span>Each resistor has a resistance of </span>\`R\`<span> &Omega;.</span>

      <p>Calculate the equivalent resistance \(R_{\mathrm{eq}}\) of the complete five-resistor network as viewed from the battery terminals. Treat the connecting wires as ideal. Enter your numerical answer in ohms, rounded to <strong>three significant digits</strong>.</p>

      <p><strong>Text description of Circuit 2:</strong> The top arm contains \(R_2\) followed by \(R_5\); the bottom arm contains \(R_4\) followed by \(R_1\). Resistor \(R_3\) joins the two arm midpoints.</p>
