bank_info:
  title: Equivalent Resistance of Five-Resistor Networks
  bank_id: PHY2-DC-REQ-10032026
  description: |
    <p>Twelve formula questions about the equivalent resistance of five equal resistors in distinct circuits. Each circuit includes a battery cell labeled \(V\). The assigned values of \(R\) are \(5.00\), \(6.00\), \(10.0\), and \(12.0\ \Omega\). Numerical resistance givens and answers use three significant digits. Each question is worth one point, with a 5% tolerance.</p>
  date created: 10-03-2026
  learning objectives:
  - PHY2-DC
  status: ready
  generation prompts:
  - circuit generation: |
      <p>Draw twelve different circuits with Schemdraw, each containing one BatteryCell labeled V and five resistors labeled R1 through R5 in a random connected network.</p>
  - bank generation: |
      <p>Create twelve formula questions corresponding to the circuits. Ask for equivalent resistance when all five resistors are equal. Use HTML snippets and MathJax, with complete symbolic solutions in general feedback. Provide four answer sets for the prescribed resistor values, with three significant digits in all numerical resistance givens and results.</p>
  - formatting prompt: YAML_formatting_prompt.md
  updates: []
  associated data:
  - circuit figures: Figures/circuit_01.png through Figures/circuit_12.png
  - source circuit collection: schemdraw_12_circuits.zip
  generation details:
    model: GPT-6
    version: '1.0'
    last updated: 10-03-2026
    converter repository: https://github.com/omoussa/yaml-to-qti/
    inspected converter revision: 7f7dfdf507c727ce50f18f94a382b0cd9ae7df9c
    question type: formula
    answer generation: Prescribed values in their supplied order; no random sampling. Bounded formula
      helper checked against exact rational coefficients and independently solved node-voltage equations.
    numerical precision: Resistance givens and precomputed results are quoted numeric strings with three
      significant digits, preserving trailing zeros. Exact symbolic integers, fractions, component counts,
      and IDs are not rounded.
    rounding: ROUND_HALF_UP; retain exact symbolic fractions until the final result.
    decimal metadata: The converter uses decimal-place metadata, not significant-digit metadata. Per-question
      decimal places were chosen so all four numeric results match the specified three-significant-digit
      results. Variable decimals=2 accommodates all prescribed input strings.
    converter limits:
    - MathJax delimiters are preserved inside HTML blocks; this converter does not translate them to MathML.
    - The converter omits points_possible metadata; the YAML requests one point per question. Confirm
      point values in Canvas after import.
    - General feedback exports as HTML text in a text/plain QTI wrapper; verify rendering in Canvas.
    - Actual Canvas import, MathJax rendering, and imported variable formatting have not been tested.
  authors:
  - O. Moussa
questions:
- formula:
    id: q1
    title: Equivalent Resistance - Circuit 1
    points: 1
    text: |
      <p>In Circuit 1, all five resistors have the same resistance: \(R_1=R_2=R_3=R_4=R_5=R\).

      <span>Each resistor has a resistance of </span>\`R\`<span> &Omega;.</span></p>

      <p>Calculate the equivalent resistance \(R_{\mathrm{eq}}\) of the complete five-resistor network as viewed from the battery terminals. Treat the connecting wires as ideal. Enter your numerical answer in ohms, rounded to <strong>three significant digits</strong>.</p>

      <p><strong>Text description of Circuit 1:</strong> Three branches connect the battery-terminal junctions. The top branch contains \(R_4\), \(R_3\), and \(R_2\) in that order. The middle branch contains \(R_1\), and the bottom branch contains \(R_5\).</p>
    figure: Figures/circuit_01.png
    variables:
    - variable:
        name: R
        min: '5.00'
        max: '12.0'
        decimals: 2
    settings:
      decimals: 2
      scientific: false
      margin_type: percent
      margin: 5
    formula: 3*R/7
    answers:
    - answer:
        R: '5.00'
        result: '2.14'
    - answer:
        R: '6.00'
        result: '2.57'
    - answer:
        R: '10.0'
        result: '4.29'
    - answer:
        R: '12.0'
        result: '5.14'
    feedback:
      general: |
        <section>
        <h3>Symbolic solution</h3>
        <p>Given: \(R_1=R_2=R_3=R_4=R_5=R\), where \(R\) is a positive resistance measured in ohms. Find \(R_{\mathrm{eq}}\) between the battery terminals. Ideal wires have zero resistance.</p>
        <p>Series resistors carry the same current and have equivalent resistance \(R_{\mathrm{s}}=\sum_i R_i\). Parallel resistors share a potential difference and satisfy \(\frac{1}{R_{\mathrm{p}}}=\sum_i\frac{1}{R_i}\).</p>
        <ol>
        <li><p><strong>Identify the branches.</strong> The top branch contains \(R_4\), \(R_3\), and \(R_2\) in series. The middle branch contains \(R_1\), and the bottom branch contains \(R_5\). All three branches connect to the same two junctions, so they are in parallel.</p></li>
        <li><p><strong>Reduce the top series branch.</strong> There are no branching junctions between these three resistors, so they carry the same current.</p><p>\[R_{\mathrm{top}}=R_4+R_3+R_2=R+R+R=3R.\]</p></li>
        <li><p><strong>Combine the three parallel branches.</strong> Parallel branches have the same potential difference; add their reciprocal resistances.</p><p>\[\frac{1}{R_{\mathrm{eq}}}=\frac{1}{R_{\mathrm{top}}}+\frac{1}{R_1}+\frac{1}{R_5}=\frac{1}{3R}+\frac{1}{R}+\frac{1}{R}=\frac{7}{3R}.\]</p></li>
        <li><p><strong>Invert and check.</strong> The equivalent resistance is smaller than \(R\), the smallest branch resistance, as expected for parallel branches.</p><p>\[\boxed{R_{\mathrm{eq}}=\frac{3}{7}R}.\]</p></li>
        <li><p><strong>Apply the assigned value and report the result.</strong> Substitute the resistance assigned to each resistor for \(R\) in the boxed expression. Keep the exact fraction until the final calculation, then report the equivalent resistance in ohms to <strong>three significant digits</strong>. The symbolic expression applies to every provided answer set.</p></li>
        </ol>
        </section>
      on_correct: |
        <p>Correct! Your equivalent resistance agrees with the circuit's connections and equal resistor values.</p>
      on_incorrect: |
        <p>Follow the electrical junctions. Combine resistors carrying the same current in series, and combine branches sharing both junctions in parallel. Work from the innermost groups outward and round only the final result.</p>
