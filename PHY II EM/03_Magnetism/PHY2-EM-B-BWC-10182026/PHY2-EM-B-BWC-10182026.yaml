        <p>The arrows below show directions only; their lengths do not represent relative field magnitudes.</p>
        <div><img src="$IMS-CC-FILEBASE$/media/mag_080_feedback.png" alt="Three-dimensional coordinate diagram. A circular N-turn coil of radius R is centered at the origin with its axis along z. Its current is clockwise when viewed from the positive z axis toward the origin. A long straight wire is parallel to the x axis and passes through (0, 0, 19) cm. Wire current flows in the negative x direction. Observation point P is at (0, 0, 13) cm. Q, the closest point on the wire to P, is at (0, 0, 19) cm. Segment PQ lies on a coordinate axis. One drawn circle represents N coincident circular turns. The sources are faint background outlines. Both magnetic-field arrows originate at P. The coil-colored arrow, labeled vector B subscript c, points in the negative z direction. The wire-colored arrow, labeled vector B subscript w, points in the negative y direction. Arrow lengths are schematic and indicate directions only." width="740" style="max-width:100%;height:auto;" /></div>
        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(-9.27\,\hat{\mathbf{j}} -7.42\,\hat{\mathbf{k}}\right)\ \mu\mathrm{T}.\]</div>
        <p>The two fields are perpendicular, so use the Pythagorean theorem for the magnitude.</p>
        <div>\[B_{\mathrm{net}}=\sqrt{B_c^2+B_w^2}=\sqrt{(7.42)^2+(9.27)^2}\ \mu\mathrm{T}.\]</div>
        <p>Keep extra digits during the calculation; intermediate values above are rounded for display. The result to three significant figures is</p>
        <div>\[\boxed{B_{\mathrm{net}}=11.9\ \mu\mathrm{T}}.\]</div>
