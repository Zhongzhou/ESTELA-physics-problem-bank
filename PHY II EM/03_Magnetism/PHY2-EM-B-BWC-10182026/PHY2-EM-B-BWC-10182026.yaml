        <p>Alternatively, use the <strong>right-hand rule</strong>: line up your right thumb with the current, in the \(-z\) direction. Your remaining fingers curl around the wire in the direction of its magnetic field. At \(P\), which lies in the \(+x\) direction from \(Q\), your curled fingers point in the negative-\(y\) direction.</p>
        <p>For a long straight wire, the field magnitude is</p>
        <div>\[B_w=\frac{\mu_0I_w}{2\pi\rho}.\]</div>
        <div>\[B_w=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(2.97\ \mathrm{A})}{2\pi(0.0560\ \mathrm{m})}=10.6\ \mu\mathrm{T}.\]</div>
        <div>\[\vec B_w=\left(-10.6\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
        <h3>4. Add the fields as vectors</h3>
        <p>The arrows below show directions only; their lengths do not represent relative field magnitudes.</p>
        <div><img src="$IMS-CC-FILEBASE$/media/mag_042_feedback.png" alt="Three-dimensional coordinate diagram. A circular N-turn coil of radius R is centered at the origin with its axis along x. Its current is counterclockwise when viewed from the positive x axis toward the origin. A long straight wire is parallel to the z axis and passes through (8.4, 0, 0) cm. Wire current flows in the negative z direction. Observation point P is at (14, 0, 0) cm. Q, the closest point on the wire to P, is at (8.4, 0, 0) cm. Segment PQ lies on a coordinate axis. One drawn circle represents N coincident circular turns. The sources are faint background outlines. Both magnetic-field arrows originate at P. The coil-colored arrow, labeled vector B subscript c, points in the positive x direction. The wire-colored arrow, labeled vector B subscript w, points in the negative y direction. Arrow lengths are schematic and indicate directions only." width="740" style="max-width:100%;height:auto;" /></div>
        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(13.2\,\hat{\mathbf{i}} -10.6\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
        <p>The two fields are perpendicular, so use the Pythagorean theorem for the magnitude.</p>
        <div>\[B_{\mathrm{net}}=\sqrt{B_c^2+B_w^2}=\sqrt{(13.2)^2+(10.6)^2}\ \mu\mathrm{T}.\]</div>
        <p>Keep extra digits during the calculation; intermediate values above are rounded for display. The result to three significant figures is</p>
        <div>\[\boxed{B_{\mathrm{net}}=17.0\ \mu\mathrm{T}}.\]</div>
