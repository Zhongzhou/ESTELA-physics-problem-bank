        <p>Let \(\hat\ell_w\) point along the wire current, and let \(\hat r_\perp\) point from the wire toward \(P\). The direction follows the cross product</p>
        <div>\[\hat\ell_w=-\hat{\mathbf{k}},\qquad \hat r_\perp=-\hat{\mathbf{i}},\qquad \hat b_w=\hat\ell_w\times\hat r_\perp=(-\hat{\mathbf{k}})\times(-\hat{\mathbf{i}})=\hat{\mathbf{j}}.\]</div>
