    title: PHY2-EM-B-BWC-10182026 - Problem 080
    points: 1
    calculator: scientific
    text: |-
      <p>A thin circular coil of \(N=24\) turns and radius \(R=9.00\ \mathrm{cm}\) is centered at the origin and lies in the \(xy\) plane. It carries a current of \(I_c=0.240\ \mathrm{A}\), flowing clockwise when viewed from the positive \(z\) axis toward the origin. Model the coil as \(N\) coincident circular turns.</p>
      <p>A long straight wire is parallel to the \(x\) axis and passes through \(Q=\left(0,\ 0,\ 19.0\right)\ \mathrm{cm}\). It carries a current of \(I_w=2.78\ \mathrm{A}\) in the \(-x\) direction. The wire is sufficiently long that end effects can be neglected.</p>
      <p>The observation point is \(P=\left(0,\ 0,\ 13.0\right)\ \mathrm{cm}\). <strong>Find the magnitude of the net magnetic field at \(P\), in microteslas \((\mu\mathrm{T})\).</strong> Report your answer to three significant figures.</p>
      <p>Use \(\mu_0=4\pi\times10^{-7}\ \mathrm{T\,m/A}\) and \(1\ \mu\mathrm{T}=10^{-6}\ \mathrm{T}\).</p>
      <div><img src="$IMS-CC-FILEBASE$/media/mag_080.png" alt="Three-dimensional coordinate diagram. A circular N-turn coil of radius R is centered at the origin with its axis along z. Its current is clockwise when viewed from the positive z axis toward the origin. A long straight wire is parallel to the x axis and passes through (0, 0, 19) cm. Wire current flows in the negative x direction. Observation point P is at (0, 0, 13) cm. Q, the closest point on the wire to P, is at (0, 0, 19) cm. Segment PQ lies on a coordinate axis. One drawn circle represents N coincident circular turns." width="740" style="max-width:100%;height:auto;" /></div>
    answer:
      value: 11.9
      margin_type: percent
      tolerance: 2
    feedback:
      general: |-
        <h3>1. Geometry and superposition</h3>
        <p>The requested quantity is the scalar magnitude \(B_{\mathrm{net}}=|\vec B_c+\vec B_w|\). Let \(a\) be the distance from the coil center to \(P\) along its axis, and let \(\rho=|\overrightarrow{QP}|\) be the shortest distance from the wire to \(P\). Convert distances to meters before substitution.</p>
        <table style="border-collapse:collapse;"><thead><tr><th scope="col" style="border:1px solid #777;padding:5px;">Quantity</th><th scope="col" style="border:1px solid #777;padding:5px;">Symbol</th><th scope="col" style="border:1px solid #777;padding:5px;">Value</th></tr></thead><tbody>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Number of turns</th><td style="border:1px solid #777;padding:5px;">\(N\)</td><td style="border:1px solid #777;padding:5px;">\(24\text{ (exact)}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil current</th><td style="border:1px solid #777;padding:5px;">\(I_c\)</td><td style="border:1px solid #777;padding:5px;">\(0.240\ \mathrm{A}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Wire current</th><td style="border:1px solid #777;padding:5px;">\(I_w\)</td><td style="border:1px solid #777;padding:5px;">\(2.78\ \mathrm{A}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil radius</th><td style="border:1px solid #777;padding:5px;">\(R\)</td><td style="border:1px solid #777;padding:5px;">\(9.00\ \mathrm{cm}=0.0900\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Axial distance</th><td style="border:1px solid #777;padding:5px;">\(a\)</td><td style="border:1px solid #777;padding:5px;">\(13.0\ \mathrm{cm}=0.130\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Distance to wire</th><td style="border:1px solid #777;padding:5px;">\(\rho\)</td><td style="border:1px solid #777;padding:5px;">\(6.00\ \mathrm{cm}=0.0600\ \mathrm{m}\)</td></tr>
        </tbody></table>
        <div>\[\overrightarrow{QP}=\vec r_P-\vec r_Q=\left(0,\ 0,\ -6.00\right)\ \mathrm{cm},\qquad \rho=0.0600\ \mathrm{m}.\]</div>
        <h3>2. Magnetic field of the circular coil</h3>
        <p>At a point on the axis of a circular \(N\)-turn coil, the field magnitude is</p>
        <div>\[B_c=\frac{\mu_0NI_cR^2}{2(R^2+a^2)^{3/2}}.\]</div>
        <div>\[B_c=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(24)(0.240\ \mathrm{A})(0.0900\ \mathrm{m})^2}{2\left[(0.0900\ \mathrm{m})^2+(0.130\ \mathrm{m})^2\right]^{3/2}}=7.42\ \mu\mathrm{T}.\]</div>
        <p>Curl the fingers of your right hand in the direction of the coil current. Your thumb points along \(-z\), so the coil field at \(P\) is in the negative-\(z\) direction.</p>
        <div>\[\vec B_c=\left(-7.42\,\hat{\mathbf{k}}\right)\ \mu\mathrm{T}.\]</div>
        <h3>3. Magnetic field of the straight wire</h3>
        <p>Let \(\hat\ell_w\) point along the wire current, and let \(\hat r_\perp\) point from the wire toward \(P\). The direction follows the cross product</p>
