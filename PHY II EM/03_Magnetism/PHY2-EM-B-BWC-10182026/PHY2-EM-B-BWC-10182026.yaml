    title: PHY2-EM-B-BWC-10182026 - Problem 077
    points: 1
    calculator: scientific
    text: |-
      <p>A thin circular coil of \(N=18\) turns and radius \(R=9.00\ \mathrm{cm}\) is centered at the origin and lies in the \(xy\) plane. It carries a current of \(I_c=0.400\ \mathrm{A}\), flowing counterclockwise when viewed from the positive \(z\) axis toward the origin. Model the coil as \(N\) coincident circular turns.</p>
      <p>A long straight wire is parallel to the \(x\) axis and passes through \(Q=\left(0,\ 0,\ 15.0\right)\ \mathrm{cm}\). It carries a current of \(I_w=2.28\ \mathrm{A}\) in the \(+x\) direction. The wire is sufficiently long that end effects can be neglected.</p>
      <p>The observation point is \(P=\left(0,\ 0,\ 12.0\right)\ \mathrm{cm}\). <strong>Find the magnitude of the net magnetic field at \(P\), in microteslas \((\mu\mathrm{T})\).</strong> Report your answer to three significant figures.</p>
      <p>Use \(\mu_0=4\pi\times10^{-7}\ \mathrm{T\,m/A}\) and \(1\ \mu\mathrm{T}=10^{-6}\ \mathrm{T}\).</p>
      <div><img src="$IMS-CC-FILEBASE$/media/mag_077.png" alt="Three-dimensional coordinate diagram. A circular N-turn coil of radius R is centered at the origin with its axis along z. Its current is counterclockwise when viewed from the positive z axis toward the origin. A long straight wire is parallel to the x axis and passes through (0, 0, 15) cm. Wire current flows in the positive x direction. Observation point P is at (0, 0, 12) cm. Q, the closest point on the wire to P, is at (0, 0, 15) cm. Segment PQ lies on a coordinate axis. One drawn circle represents N coincident circular turns." width="740" style="max-width:100%;height:auto;" /></div>
    answer:
      value: 18.7
      margin_type: percent
      tolerance: 2
    feedback:
      general: |-
        <h3>1. Geometry and superposition</h3>
        <p>The requested quantity is the scalar magnitude \(B_{\mathrm{net}}=|\vec B_c+\vec B_w|\). Let \(a\) be the distance from the coil center to \(P\) along its axis, and let \(\rho=|\overrightarrow{QP}|\) be the shortest distance from the wire to \(P\). Convert distances to meters before substitution.</p>
        <table style="border-collapse:collapse;"><thead><tr><th scope="col" style="border:1px solid #777;padding:5px;">Quantity</th><th scope="col" style="border:1px solid #777;padding:5px;">Symbol</th><th scope="col" style="border:1px solid #777;padding:5px;">Value</th></tr></thead><tbody>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Number of turns</th><td style="border:1px solid #777;padding:5px;">\(N\)</td><td style="border:1px solid #777;padding:5px;">\(18\text{ (exact)}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil current</th><td style="border:1px solid #777;padding:5px;">\(I_c\)</td><td style="border:1px solid #777;padding:5px;">\(0.400\ \mathrm{A}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Wire current</th><td style="border:1px solid #777;padding:5px;">\(I_w\)</td><td style="border:1px solid #777;padding:5px;">\(2.28\ \mathrm{A}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil radius</th><td style="border:1px solid #777;padding:5px;">\(R\)</td><td style="border:1px solid #777;padding:5px;">\(9.00\ \mathrm{cm}=0.0900\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Axial distance</th><td style="border:1px solid #777;padding:5px;">\(a\)</td><td style="border:1px solid #777;padding:5px;">\(12.0\ \mathrm{cm}=0.120\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Distance to wire</th><td style="border:1px solid #777;padding:5px;">\(\rho\)</td><td style="border:1px solid #777;padding:5px;">\(3.00\ \mathrm{cm}=0.0300\ \mathrm{m}\)</td></tr>
        </tbody></table>
        <div>\[\overrightarrow{QP}=\vec r_P-\vec r_Q=\left(0,\ 0,\ -3.00\right)\ \mathrm{cm},\qquad \rho=0.0300\ \mathrm{m}.\]</div>
        <h3>2. Magnetic field of the circular coil</h3>
        <p>At a point on the axis of a circular \(N\)-turn coil, the field magnitude is</p>
        <div>\[B_c=\frac{\mu_0NI_cR^2}{2(R^2+a^2)^{3/2}}.\]</div>
        <div>\[B_c=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(18)(0.400\ \mathrm{A})(0.0900\ \mathrm{m})^2}{2\left[(0.0900\ \mathrm{m})^2+(0.120\ \mathrm{m})^2\right]^{3/2}}=10.9\ \mu\mathrm{T}.\]</div>
        <p>Curl the fingers of your right hand in the direction of the coil current. Your thumb points along \(+z\), so the coil field at \(P\) is in the positive-\(z\) direction.</p>
        <div>\[\vec B_c=\left(10.9\,\hat{\mathbf{k}}\right)\ \mu\mathrm{T}.\]</div>
        <h3>3. Magnetic field of the straight wire</h3>
        <p>Let \(\hat\ell_w\) point along the wire current, and let \(\hat r_\perp\) point from the wire toward \(P\). The direction follows the cross product</p>
        <div>\[\hat\ell_w=\hat{\mathbf{i}},\qquad \hat r_\perp=-\hat{\mathbf{k}},\qquad \hat b_w=\hat\ell_w\times\hat r_\perp=(\hat{\mathbf{i}})\times(-\hat{\mathbf{k}})=\hat{\mathbf{j}}.\]</div>
        <p>Alternatively, use the <strong>right-hand rule</strong>: line up your right thumb with the current, in the \(+x\) direction. Your remaining fingers curl around the wire in the direction of its magnetic field. At \(P\), which lies in the \(-z\) direction from \(Q\), your curled fingers point in the positive-\(y\) direction.</p>
        <p>For a long straight wire, the field magnitude is</p>
        <div>\[B_w=\frac{\mu_0I_w}{2\pi\rho}.\]</div>
        <div>\[B_w=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(2.28\ \mathrm{A})}{2\pi(0.0300\ \mathrm{m})}=15.2\ \mu\mathrm{T}.\]</div>
        <div>\[\vec B_w=\left(15.2\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
        <h3>4. Add the fields as vectors</h3>
        <p>The arrows below show directions only; their lengths do not represent relative field magnitudes.</p>
        <div><img src="$IMS-CC-FILEBASE$/media/mag_077_feedback.png" alt="Three-dimensional coordinate diagram. A circular N-turn coil of radius R is centered at the origin with its axis along z. Its current is counterclockwise when viewed from the positive z axis toward the origin. A long straight wire is parallel to the x axis and passes through (0, 0, 15) cm. Wire current flows in the positive x direction. Observation point P is at (0, 0, 12) cm. Q, the closest point on the wire to P, is at (0, 0, 15) cm. Segment PQ lies on a coordinate axis. One drawn circle represents N coincident circular turns. The sources are faint background outlines. Both magnetic-field arrows originate at P. The coil-colored arrow, labeled vector B subscript c, points in the positive z direction. The wire-colored arrow, labeled vector B subscript w, points in the positive y direction. Arrow lengths are schematic and indicate directions only." width="740" style="max-width:100%;height:auto;" /></div>
        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(15.2\,\hat{\mathbf{j}} +10.9\,\hat{\mathbf{k}}\right)\ \mu\mathrm{T}.\]</div>
        <p>The two fields are perpendicular, so use the Pythagorean theorem for the magnitude.</p>
        <div>\[B_{\mathrm{net}}=\sqrt{B_c^2+B_w^2}=\sqrt{(10.9)^2+(15.2)^2}\ \mu\mathrm{T}.\]</div>
        <p>Keep extra digits during the calculation; intermediate values above are rounded for display. The result to three significant figures is</p>
        <div>\[\boxed{B_{\mathrm{net}}=18.7\ \mu\mathrm{T}}.\]</div>
