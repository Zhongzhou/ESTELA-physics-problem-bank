        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil radius</th><td style="border:1px solid #777;padding:5px;">\(R\)</td><td style="border:1px solid #777;padding:5px;">\(7.50\ \mathrm{cm}=0.0750\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Axial distance</th><td style="border:1px solid #777;padding:5px;">\(a\)</td><td style="border:1px solid #777;padding:5px;">\(12.0\ \mathrm{cm}=0.120\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Distance to wire</th><td style="border:1px solid #777;padding:5px;">\(\rho\)</td><td style="border:1px solid #777;padding:5px;">\(7.20\ \mathrm{cm}=0.0720\ \mathrm{m}\)</td></tr>
        </tbody></table>
        <div>\[\overrightarrow{QP}=\vec r_P-\vec r_Q=\left(0,\ 7.20,\ 0\right)\ \mathrm{cm},\qquad \rho=0.0720\ \mathrm{m}.\]</div>
        <h3>2. Magnetic field of the circular coil</h3>
        <p>At a point on the axis of a circular \(N\)-turn coil, the field magnitude is</p>
        <div>\[B_c=\frac{\mu_0NI_cR^2}{2(R^2+a^2)^{3/2}}.\]</div>
        <div>\[B_c=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(40)(0.450\ \mathrm{A})(0.0750\ \mathrm{m})^2}{2\left[(0.0750\ \mathrm{m})^2+(0.120\ \mathrm{m})^2\right]^{3/2}}=22.4\ \mu\mathrm{T}.\]</div>
        <p>Curl the fingers of your right hand in the direction of the coil current. Your thumb points along \(-y\), so the coil field at \(P\) is in the negative-\(y\) direction.</p>
        <div>\[\vec B_c=\left(-22.4\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
