        </tbody></table>
        <div>\[\overrightarrow{QP}=\vec r_P-\vec r_Q=\left(0,\ 7.80,\ 0\right)\ \mathrm{cm},\qquad \rho=0.0780\ \mathrm{m}.\]</div>
        <h3>2. Magnetic field of the circular coil</h3>
        <p>At a point on the axis of a circular \(N\)-turn coil, the field magnitude is</p>
        <div>\[B_c=\frac{\mu_0NI_cR^2}{2(R^2+a^2)^{3/2}}.\]</div>
        <div>\[B_c=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(25)(0.350\ \mathrm{A})(0.0600\ \mathrm{m})^2}{2\left[(0.0600\ \mathrm{m})^2+(0.130\ \mathrm{m})^2\right]^{3/2}}=6.74\ \mu\mathrm{T}.\]</div>
