        <div>\[\hat\ell_w=\hat{\mathbf{j}},\qquad \hat r_\perp=-\hat{\mathbf{k}},\qquad \hat b_w=\hat\ell_w\times\hat r_\perp=(\hat{\mathbf{j}})\times(-\hat{\mathbf{k}})=-\hat{\mathbf{i}}.\]</div>
