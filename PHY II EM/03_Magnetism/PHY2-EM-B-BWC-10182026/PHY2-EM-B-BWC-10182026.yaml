        <p>For a long straight wire, the field magnitude is</p>
        <div>\[B_w=\frac{\mu_0I_w}{2\pi\rho}.\]</div>
        <div>\[B_w=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(1.29\ \mathrm{A})}{2\pi(0.0700\ \mathrm{m})}=3.69\ \mu\mathrm{T}.\]</div>
        <div>\[\vec B_w=\left(-3.69\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
