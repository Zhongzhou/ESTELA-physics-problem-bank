        <p>The arrows below show directions only; their lengths do not represent relative field magnitudes.</p>
        <div><img src="$IMS-CC-FILEBASE$/media/mag_051_feedback.png" alt="Three-dimensional coordinate diagram. A circular N-turn coil of radius R is centered at the origin with its axis along y. Its current is clockwise when viewed from the positive y axis toward the origin. A long straight wire is parallel to the z axis and passes through (0, 4.8, 0) cm. Wire current flows in the positive z direction. Observation point P is at (0, 12, 0) cm. Q, the closest point on the wire to P, is at (0, 4.8, 0) cm. Segment PQ lies on a coordinate axis. One drawn circle represents N coincident circular turns. The sources are faint background outlines. Both magnetic-field arrows originate at P. The coil-colored arrow, labeled vector B subscript c, points in the negative y direction. The wire-colored arrow, labeled vector B subscript w, points in the negative x direction. Arrow lengths are schematic and indicate directions only." width="740" style="max-width:100%;height:auto;" /></div>
        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(-18.0\,\hat{\mathbf{i}} -22.4\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
