        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(-6.14\,\hat{\mathbf{i}} -3.69\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
