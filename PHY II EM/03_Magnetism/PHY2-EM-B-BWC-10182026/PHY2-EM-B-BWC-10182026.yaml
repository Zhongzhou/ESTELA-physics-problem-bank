        <p>Alternatively, use the <strong>right-hand rule</strong>: line up your right thumb with the current, in the \(-x\) direction. Your remaining fingers curl around the wire in the direction of its magnetic field. At \(P\), which lies in the \(-z\) direction from \(Q\), your curled fingers point in the negative-\(y\) direction.</p>
        <p>For a long straight wire, the field magnitude is</p>
        <div>\[B_w=\frac{\mu_0I_w}{2\pi\rho}.\]</div>
        <div>\[B_w=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(2.78\ \mathrm{A})}{2\pi(0.0600\ \mathrm{m})}=9.27\ \mu\mathrm{T}.\]</div>
        <div>\[\vec B_w=\left(-9.27\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
