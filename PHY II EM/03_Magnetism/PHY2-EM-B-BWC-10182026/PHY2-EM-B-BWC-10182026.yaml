        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(-8.43\,\hat{\mathbf{i}} -14.1\,\hat{\mathbf{j}}\right)\ \mu\mathrm{T}.\]</div>
