      <p>The observation point is \(P=\left(0,\ 10.0,\ 0\right)\ \mathrm{cm}\). <strong>Find the magnitude of the net magnetic field at \(P\), in microteslas \((\mu\mathrm{T})\).</strong> Report your answer to three significant figures.</p>
