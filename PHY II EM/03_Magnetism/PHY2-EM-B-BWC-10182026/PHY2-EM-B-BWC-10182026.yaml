        <div>\[\vec B_{\mathrm{net}}=\vec B_c+\vec B_w=\left(-21.1\,\hat{\mathbf{i}} +30.1\,\hat{\mathbf{k}}\right)\ \mu\mathrm{T}.\]</div>
        <p>The two fields are perpendicular, so use the Pythagorean theorem for the magnitude.</p>
