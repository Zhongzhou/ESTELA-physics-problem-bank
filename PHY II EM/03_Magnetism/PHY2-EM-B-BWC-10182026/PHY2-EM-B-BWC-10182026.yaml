        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Axial distance</th><td style="border:1px solid #777;padding:5px;">\(a\)</td><td style="border:1px solid #777;padding:5px;">\(14.0\ \mathrm{cm}=0.140\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Distance to wire</th><td style="border:1px solid #777;padding:5px;">\(\rho\)</td><td style="border:1px solid #777;padding:5px;">\(4.00\ \mathrm{cm}=0.0400\ \mathrm{m}\)</td></tr>
        </tbody></table>
        <div>\[\overrightarrow{QP}=\vec r_P-\vec r_Q=\left(0,\ -4.00,\ 0\right)\ \mathrm{cm},\qquad \rho=0.0400\ \mathrm{m}.\]</div>
        <h3>2. Magnetic field of the circular coil</h3>
        <p>At a point on the axis of a circular \(N\)-turn coil, the field magnitude is</p>
        <div>\[B_c=\frac{\mu_0NI_cR^2}{2(R^2+a^2)^{3/2}}.\]</div>
        <div>\[B_c=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(18)(0.400\ \mathrm{A})(0.0700\ \mathrm{m})^2}{2\left[(0.0700\ \mathrm{m})^2+(0.140\ \mathrm{m})^2\right]^{3/2}}=5.78\ \mu\mathrm{T}.\]</div>
        <p>Curl the fingers of your right hand in the direction of the coil current. Your thumb points along \(+y\), so the coil field at \(P\) is in the positive-\(y\) direction.</p>
