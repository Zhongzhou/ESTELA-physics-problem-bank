        <table style="border-collapse:collapse;"><thead><tr><th scope="col" style="border:1px solid #777;padding:5px;">Quantity</th><th scope="col" style="border:1px solid #777;padding:5px;">Symbol</th><th scope="col" style="border:1px solid #777;padding:5px;">Value</th></tr></thead><tbody>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Number of turns</th><td style="border:1px solid #777;padding:5px;">\(N\)</td><td style="border:1px solid #777;padding:5px;">\(36\text{ (exact)}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil current</th><td style="border:1px solid #777;padding:5px;">\(I_c\)</td><td style="border:1px solid #777;padding:5px;">\(0.200\ \mathrm{A}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Wire current</th><td style="border:1px solid #777;padding:5px;">\(I_w\)</td><td style="border:1px solid #777;padding:5px;">\(5.12\ \mathrm{A}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Coil radius</th><td style="border:1px solid #777;padding:5px;">\(R\)</td><td style="border:1px solid #777;padding:5px;">\(8.00\ \mathrm{cm}=0.0800\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Axial distance</th><td style="border:1px solid #777;padding:5px;">\(a\)</td><td style="border:1px solid #777;padding:5px;">\(8.00\ \mathrm{cm}=0.0800\ \mathrm{m}\)</td></tr>
        <tr><th scope="row" style="border:1px solid #777;padding:5px;">Distance to wire</th><td style="border:1px solid #777;padding:5px;">\(\rho\)</td><td style="border:1px solid #777;padding:5px;">\(3.20\ \mathrm{cm}=0.0320\ \mathrm{m}\)</td></tr>
        </tbody></table>
        <div>\[\overrightarrow{QP}=\vec r_P-\vec r_Q=\left(0,\ 3.20,\ 0\right)\ \mathrm{cm},\qquad \rho=0.0320\ \mathrm{m}.\]</div>
        <h3>2. Magnetic field of the circular coil</h3>
        <p>At a point on the axis of a circular \(N\)-turn coil, the field magnitude is</p>
        <div>\[B_c=\frac{\mu_0NI_cR^2}{2(R^2+a^2)^{3/2}}.\]</div>
        <div>\[B_c=\frac{(4\pi\times10^{-7}\ \mathrm{T\,m/A})(36)(0.200\ \mathrm{A})(0.0800\ \mathrm{m})^2}{2\left[(0.0800\ \mathrm{m})^2+(0.0800\ \mathrm{m})^2\right]^{3/2}}=20.0\ \mu\mathrm{T}.\]</div>
        <p>Curl the fingers of your right hand in the direction of the coil current. Your thumb points along \(-y\), so the coil field at \(P\) is in the negative-\(y\) direction.</p>
