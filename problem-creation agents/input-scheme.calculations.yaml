# Calculation table for the problem-creation workflow.
# Python writes this file.
# equation_sets are the Agent 4 rows.
# rows pair each accepted scenario with every equation set.
source_input: problem-creation agents\input-scheme.yaml
source_scenarios: problem-creation agents\input-scheme.scenarios.yaml
rounding_decimal: 2
needs_classifier: false
classify_attempts: 0
parameters_source: input
variable_specifications:
- r is the radius of the circular motion
- Give or ask for either period T or frequency f, not both.
- Do not directly give or ask for linear velocity v or angular velocity.
equation_sets:
- id: eqset_01
  formulas:
  - F_{\mathrm{net}} = \frac{m v^{2}}{r}
  - T = \frac{2 \pi r}{v}
  parsed:
  - Eq(F_net, m*v**2/r)
  - Eq(T, 2*pi*r/v)
  symbols:
  - F_net
  - m
  - v
  - r
  - T
  - pi
  function: solve_eqset_01
  constants:
  - symbol: pi
    python: math.pi
    value: 3.141592653589793
  parameters:
  - F_net
  - m
  - r
  computed:
  - v
  - T
  steps:
  - symbol: v
    expression: math.sqrt(F_net*r/m)
  - symbol: T
    expression: 2*math.pi*r/v
  validated: true
- id: eqset_02
  formulas:
  - F_{\mathrm{net}} = \frac{m v^{2}}{r}
  - f = \frac{v}{2 \pi r}
  parsed:
  - Eq(F_net, m*v**2/r)
  - Eq(f, v/(2*pi*r))
  symbols:
  - F_net
  - m
  - v
  - r
  - f
  - pi
  function: solve_eqset_02
  constants:
  - symbol: pi
    python: math.pi
    value: 3.141592653589793
  parameters:
  - F_net
  - m
  - r
  computed:
  - v
  - f
  steps:
  - symbol: v
    expression: math.sqrt(F_net*r/m)
  - symbol: f
    expression: (1/2)*v/(math.pi*r)
  validated: true
